<style>

.tgl{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.tgl input{width:24px;height:24px;accent-color:var(--yellow-deep);margin:2px 0 0;flex:none}

.nm{border:0;background:var(--field);border-radius:999px;padding:8px 13px;font-weight:700;font-size:15px;cursor:pointer}
.exp{font-size:22px;font-weight:800;margin:8px 0 0;font-family:"Bricolage Grotesque",sans-serif}

.awards{display:grid;gap:10px}
.aw{display:flex;gap:12px;align-items:center;background:var(--field);border-radius:14px;padding:12px 14px;text-align:left}
.aw .ic{font-size:26px;line-height:1}.aw b{display:block;font-size:15px}.aw span{color:var(--muted);font-weight:600;font-size:14px}
.tvboard{width:min(92vw,1100px);display:grid;gap:1.2vmin;margin-top:3vmin}
.tvrow{display:flex;justify-content:space-between;align-items:center;gap:3vmin;background:var(--card);border-radius:2vmin;padding:1.8vmin 3vmin;font-size:min(5vmin,48px);font-weight:800;text-align:left}
.tvrow small{display:block;font-size:min(2.4vmin,22px);color:var(--muted);font-weight:600}
.tvrow span{font-family:"Bricolage Grotesque",sans-serif;font-size:min(7vmin,72px)}

.tvfin .tvaw .aw{padding:1.4vmin 2vmin}.tvfin .tvaw .aw .ic{font-size:min(4.5vmin,40px)}.tvfin .tvaw .aw b{font-size:min(2.4vmin,22px)}.tvfin .tvaw .aw span{font-size:min(2.1vmin,19px)}

.rv.show{opacity:1;transform:none}
.rvpre.show{display:none}
.tvteam .rv{display:none}.tvteam .rv.show{display:inline}
.place{color:var(--muted);margin-right:.4em}

.tvteam.sm{font-size:min(10vmin,110px)}
.tvexp{font-size:min(5vmin,48px);font-weight:800;margin:0}
.tvcount{font-size:min(6vmin,56px);font-weight:800;margin:1vmin 0 0;font-family:"Bricolage Grotesque",sans-serif}

/* ===== Supabase ===== */
async function api(path,opt={}){
  const r=await fetch(SB+path,{...opt,headers:{...H,...(opt.headers||{})}});
  const txt=await r.text();let body=null;try{body=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){const e=new Error((body&&body.message)||('HTTP '+r.status));e.status=r.status;e.code=body&&body.code;
    if(r.status===404||e.code==='PGRST205'||e.code==='42P01'||e.code==='42501')DBERR=true;throw e}
  return body;
}
/* Every change is an operation. If another phone wrote first, we fetch the
   newest state and re-apply our pending operations on top of it. */
let OPS=[],inflight=false;
function act(fn){
  try{fn(S)}catch(e){console.error(e)}
  if(MODE==='local'){ls(LKEY,JSON.stringify(S));render();return}
  OPS.push(fn);render();push();
}
async function push(){
  if(MODE!=='online'||inflight||!OPS.length)return;
  inflight=true;const n=OPS.length,v=VER;
  try{
    const j=await api(`gulbolle_rom?kode=eq.${ROOM}&versjon=eq.${v}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({state:S,versjon:v+1})});
    if(j&&j.length){VER=j[0].versjon;OPS.splice(0,n);inflight=false;if(OPS.length)push();return}
    const r=await api(`gulbolle_rom?kode=eq.${ROOM}&select=state,versjon`);
    inflight=false;
    if(r&&r.length){VER=r[0].versjon;S=r[0].state;for(const f of OPS){try{f(S)}catch(e){}}render()}
    push();
  }catch(e){inflight=false;toast('Nettfeil, prøver igjen …');setTimeout(push,1200)}
}
async function pull(){
  if(MODE!=='online'||inflight||OPS.length)return;
  try{
    const j=await api(`gulbolle_rom?kode=eq.${ROOM}&select=state,versjon`);
    if(!j||!j.length||inflight||OPS.length)return;
    if(j[0].versjon>VER){VER=j[0].versjon;S=j[0].state;render()}
  }catch(e){}
}
async function pullCount(){} /* slips now live in the room state */

},500);

function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
async function createRoom(){
  if(BUSY)return;BUSY=true;render();const st=freshState();

    for(let k=0;k<6;k++){const code=genCode();
      try{await api('gulbolle_rom',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({kode:code,state:st,versjon:0})});BUSY=false;HOSTSETUP=true;enterRoom(code,st,0);return}
      catch(e){if(e.status===409)continue;throw e}}
    throw new Error('Fant ingen ledig kode');
  }catch(e){BUSY=false;render();toast(DBERR?'Databasen er ikke satt opp ennå':'Klarte ikke å lage spill: '+e.message)}
}

function unlockAudio(){

  try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=='running')AC.resume().then(()=>{if(ROLE==='klokke')render()}).catch(()=>{})}catch(e){}
}
document.addEventListener('touchend',unlockAudio,{passive:true});document.addEventListener('click',unlockAudio);
function tone(f,d,v=.25,type='square',delay=0){
  if(!SOUND||!AC)return;
  try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}
function beep(){tone(880,.09,.2)}

/* ===== Clock (runs on every phone) ===== */
let lastSec=null,hornKey=null,stealKey=null;
setInterval(clockTick,200);
function clockTick(){
  if(!S||!MODE)return;
  if(S.phase==='turn'&&S.timer){
    const left=leftOf(S);
    document.querySelectorAll('.tleft').forEach(el=>{el.textContent=S.timer.running?fmt(left):'Pause';el.classList.toggle('low',S.timer.running&&left<=10000)});
    if(S.timer.running){
      const sec=Math.ceil(left/1000);
      if(sec>=1&&sec<=5&&sec!==lastSec){lastSec=sec;beep()}
      if(left<=0){
        if(hornKey!==S.timer.endsAt){hornKey=S.timer.endsAt;horn();buzz([250,120,250])}
        if(myTurn()||(ROLE==='dommer'&&left<-2500))doTimeUp(false);
      }
    }
  }
  if(S.phase==='final'){
    const now=Date.now();
    document.querySelectorAll('[data-at]').forEach(el=>{
      if(el.classList.contains('show'))return;
      if(now>=+el.dataset.at||REVEAL_SKIP){el.classList.add('show');
        if(!el.dataset.played&&now-+el.dataset.at<1500){el.dataset.played=1;
          if(el.dataset.snd==='row')tone(392,.18,.22,'triangle');
          if(el.dataset.snd==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.35,.25,'triangle',i*.14));buzz([80,60,80,60,200])}}}
    });
    if(ROLE!=='klokke'&&!FINAL_SHOWN&&revealDone()){FINAL_SHOWN=true;render()}
  }
  if(S.phase==='summary'&&S.steal&&S.steal.open&&S.steal.endsAt){
    const left=S.steal.endsAt-Date.now();
    document.querySelectorAll('.sleft').forEach(el=>{el.textContent=left>0?Math.ceil(left/1000):'Tiden er ute!';el.classList.toggle('done',left<=0)});
    if(left<=0&&stealKey!==S.steal.endsAt){stealKey=S.steal.endsAt;tone(330,.6,.3,'sawtooth');buzz(200)}
  }
}

/* ===== Timer rings (scene edge + judge circle) ===== */
const JC=2*Math.PI*90;let EDGE_P=0;
function timeFrac(){const t=S&&S.timer;if(!t)return 0;const tot=t.total||((S.dur||60)*1000);const l=leftOf(S);return l==null?0:Math.max(0,Math.min(1,l/tot))}
function layoutEdge(){
  const w=innerWidth,h=innerHeight,i=5,r=Math.min(46,w/4,h/4),x0=i,y0=i,x1=w-i,y1=h-i,cx=w/2;
  const d=`M${cx} ${y0}H${x1-r}A${r} ${r} 0 0 1 ${x1} ${y0+r}V${y1-r}A${r} ${r} 0 0 1 ${x1-r} ${y1}H${x0+r}A${r} ${r} 0 0 1 ${x0} ${y1-r}V${y0+r}A${r} ${r} 0 0 1 ${x0+r} ${y0}Z`;
  EDGE_P=2*(x1-x0-2*r)+2*(y1-y0-2*r)+2*Math.PI*r;
  const e=$('edge');e.setAttribute('viewBox',`0 0 ${w} ${h}`);e.querySelectorAll('path').forEach(p=>p.setAttribute('d',d));
}
addEventListener('resize',layoutEdge);
function ringFrame(){
  const turn=!!(S&&MODE&&S.phase==='turn'&&S.timer);
  const frac=turn?timeFrac():0,low=turn&&S.timer.running&&leftOf(S)<=10000;
  const e=$('edge'),showEdge=turn&&ROLE==='scene';
  e.classList.toggle('on',showEdge);
  if(showEdge){if(!EDGE_P)layoutEdge();e.querySelector('.prg').style.strokeDasharray=`${frac*EDGE_P} ${EDGE_P+1}`;e.classList.toggle('low',low)}
  document.querySelectorAll('.jring').forEach(j=>{j.querySelector('.prg').style.strokeDasharray=`${frac*JC} ${JC+1}`;j.classList.toggle('low',low)});
  requestAnimationFrame(ringFrame);
}
requestAnimationFrame(ringFrame);

function clearWords(){for(let i=0;i<S.perPerson+1;i++){const el=$('w'+i);if(el)el.value=''}BONUS=false}
function wordKey(e,i){if(e.key==='Enter'){e.preventDefault();const nx=$('w'+(i+1));if(nx)nx.focus();else MODE==='local'?addBatch():sendWords()}}

  <button class="btn ghost" style="margin-top:0" onclick="setRole('klokke')">🖥️ Denne skjermen er TV-en</button>`}`;

  if(!v){toast('Skriv navnet ditt først');el&&el.focus();return null}

  act(s=>{if(s.phase!=='words')return;(s.slips=s.slips||[]).push(...got.map(t=>({t,by})))});
  ls(sentKey(),'1');EXTRA=false;buzz(25);render();
  toast(got.length+' '+(got.length===1?'lapp':'lapper')+' i bollen!');document.activeElement&&document.activeElement.blur();
}

  <h1 style="margin-top:12px">Bollen fylles</h1>
  <p class="lede">Alle går inn på <b>raggan.no/gulbolle</b>, trykker «Bli med» og skriver koden <b>${ROOM}</b>.</p>
  <div class="count"><b id="lcount">${slipCount()}</b><span>lapper i bollen<br>oppdateres av seg selv</span></div>
  ${S.useNames&&players(S).length?`<p class="small" style="margin:10px 2px 0"><b>Har skrevet:</b> ${players(S).map(esc).join(', ')}</p>`:''}

  if(slipCount()<2){toast('For få lapper');return}
  if(!confirm('Er alle ferdige med lappene? '+slipCount()+' lapper i bollen.'))return;
  act(s=>{if(s.phase!=='words')return;buildWords(s);s.deleted=[];beginGame(s)});
}
function rosterCard(){
  if(!S.useNames)return '';
  const ps=players(S);if(!ps.length)return '';
  const r=S.roster||{};const free=ps.filter(n=>r[n]==null||r[n]>=S.teams.length);
  const chip=n=>`<button class="nm" onclick="moveP(${ps.indexOf(n)})">${esc(n)}</button>`;
  return `<div class="card"><p class="label">Lagene · trykk på et navn for å flytte det</p>
    ${S.teams.map((t,i)=>`<b>${esc(t)}</b><div class="names">${members(i).map(chip).join('')||'<span class="small">Ingen ennå</span>'}</div>`).join('')}
    ${free.length?`<b>Ikke fordelt</b><div class="names">${free.map(chip).join('')}</div>`:''}
    <div class="row2"><button class="btn outline" onclick="fillTeams()">Fordel nye</button><button class="btn outline" onclick="shuffleTeams()">Stokk alle</button></div>
    <p class="small" style="margin:10px 0 0">De som ikke er fordelt når spillet starter, havner automatisk på det minste laget.</p></div>`;
}
function vLocalWords(){
  return header(false)+`<h1>Skriv lappene</h1>
  <p class="lede">Hver person skriver ${S.perPerson} ting, trykker «Legg i bollen» og sender mobilen videre.</p>
  <div class="card">${wordInputs()}<button class="btn primary" onclick="addBatch()">Legg i bollen</button></div>
  <div class="count"><b>${slipCount()}</b><span>lapper i bollen<br>fra ${S.batches.length} ${S.batches.length===1?'person':'personer'}</span></div>
  ${S.batches.length?'<button class="btn ghost" onclick="undoBatch()">Angre siste person</button>':''}
  <div class="spacer"></div>
  <button class="btn dark" ${slipCount()<2?'disabled':''} onclick="act(s=>{buildWords(s);s.deleted=[];beginGame(s)})">Alle er ferdige, start spillet</button>
  <button class="btn ghost" onclick="act(s=>s.phase='setup')">Tilbake til lag</button>`;
}
function addBatch(){const got=readWords();if(!got.length){toast('Skriv minst én lapp');return}const by=readName();if(by==null)return;clearWords();const nm=$('pname');if(nm)nm.value='';act(s=>{(s.slips=s.slips||[]).push(...got.map(t=>({t,by})));s.batches.push(got.length)});buzz(20);toast(got.length+' i bollen. Send mobilen videre!');document.activeElement&&document.activeElement.blur()}
function undoBatch(){act(s=>{const k=s.batches.pop();if(k)s.slips.splice(s.slips.length-k,k)})}

/* ---------- GAME ENGINE ---------- */
function normWord(t){return String(t).normalize('NFKC').toLowerCase().replace(/[\s ]+/g,' ').replace(/^[\s"'«»]+|[\s"'«».!?,]+$/g,'')}
function dedupe(list){const seen=new Set();return list.filter(t=>{const k=normWord(t);if(!k||seen.has(k))return false;seen.add(k);return true})}
function resetTurn(s){s.turnExp=null;s.turnStart=null;s.turnGot=[];s.turnSkipped=[];s.turnLog=[];s.steal=null;s.current=null;s.turnDev=null;s.timer=null}
function fillBowl(s){const del=s.deleted||[];s.bowl=shuffle(s.words.map((_,i)=>i).filter(i=>!del.includes(i)));s.roundTaken={};s.roundSkipped={};resetTurn(s)}
function buildWords(s){
  const map=new Map();s.words=[];s.wordBy=[];
  for(const sl of (s.slips||[])){const k=normWord(sl.t);if(!k)continue;
    if(map.has(k)){const i=map.get(k);if(sl.by&&!s.wordBy[i].includes(sl.by))s.wordBy[i].push(sl.by);continue}
    map.set(k,s.words.length);s.words.push(sl.t);s.wordBy.push(sl.by?[sl.by]:[])}
  const gone=(s.slips||[]).length-s.words.length;
  if(gone>0)setTimeout(()=>toast(gone+(gone===1?' duplikat':' duplikater')+' fjernet'),50);
}
function players(s){const seen=new Set(),out=[];(s.slips||[]).forEach(x=>{const n=(x.by||'').trim(),k=n.toLowerCase();if(n&&!seen.has(k)){seen.add(k);out.push(n)}});return out}
function members(i,s=S){const r=s.roster||{};return players(s).filter(n=>r[n]===i)}
function ensureRoster(s){
  s.roster=s.roster||{};const T=s.teams.length,ps=players(s);
  for(const n of Object.keys(s.roster))if(s.roster[n]>=T||!ps.includes(n))delete s.roster[n];
  for(const n of shuffle(ps.filter(n=>s.roster[n]==null))){
    const sz=s.teams.map((_,i)=>ps.filter(p=>s.roster[p]===i).length),min=Math.min(...sz);
    const c=sz.map((v,i)=>v===min?i:-1).filter(i=>i>=0);s.roster[n]=c[Math.floor(Math.random()*c.length)];
  }
}
function fillTeams(){act(ensureRoster)}
function shuffleTeams(){act(s=>{s.roster={};ensureRoster(s)})}
function moveP(k){const n=players(S)[k];if(n==null)return;act(s=>{s.roster=s.roster||{};const c=s.roster[n];s.roster[n]=(c==null||c>=s.teams.length-1)?0:c+1})}
function explainerOf(s,team){if(!s.useNames)return null;const m=members(team,s);if(!m.length)return null;return m[((s.expIdx||[])[team]||0)%m.length]}
function advanceExp(s,team){s.expIdx=s.expIdx&&s.expIdx.length===s.teams.length?s.expIdx:s.teams.map(()=>0);s.expIdx[team]=(s.expIdx[team]||0)+1}
function beginGame(s){s.finalAt=null;
  const del=s.deleted||[];const keep=s.words.map((_,i)=>i).filter(i=>!del.includes(i));
  s.words=keep.map(i=>s.words[i]);s.wordBy=keep.map(i=>(s.wordBy||[])[i]||[]);s.deleted=[];
  if(s.useNames)ensureRoster(s);s.expIdx=s.teams.map(()=>0);
  s.seen=[];s.history=[];s.scores=s.teams.map(()=>[0,0,0]);s.round=0;s.teamIdx=0;s.carry=false;s.carryLeft=0;s.dur=s.dur||60;fillBowl(s);s.phase='ready';
}
function draw(s){
  if(!s.bowl.length){s.current=null;return}
  const pool=s.bowl.filter(i=>i!==s.current);
  s.current=pool.length?pool[Math.floor(Math.random()*pool.length)]:s.bowl[0];
}
function takeWord(s,w,team){s.seen=s.seen||[];if(!s.seen.includes(w))s.seen.push(w);s.bowl=s.bowl.filter(i=>i!==w);(s.roundTaken=s.roundTaken||{})[w]=team;s.scores[team][s.round]++}
/* after a slip leaves the bowl mid-turn: draw the next one, or end the round */
function afterRemove(s){
  if(s.phase!=='turn')return;
  if(!s.bowl.length){s.carryLeft=Math.max(0,leftOf(s)||0);s.timer={running:false,endsAt:null,left:0};s.current=null;s.steal=null;s.phase='summary'}
  else if(s.current==null||!s.bowl.includes(s.current))draw(s);
}
function place(s,w,toBowl){if(toBowl){rm(s.deleted,w);if(!s.bowl.includes(w))s.bowl.push(w)}else{s.bowl=s.bowl.filter(i=>i!==w);s.deleted=s.deleted||[];if(!s.deleted.includes(w))s.deleted.push(w)}}

let lastTap=0;
function guard(){const t=Date.now();if(t-lastTap<350)return false;lastTap=t;return myTurn()}
function startTurn(){
  unlockAudio();const ti=S.teamIdx,rd=S.round;
  act(s=>{if(s.phase!=='ready'||s.teamIdx!==ti||s.round!==rd)return;
    const ms=(s.carry&&s.carryLeft>1000)?s.carryLeft:(s.dur||60)*1000;
    resetTurn(s);s.carry=false;s.carryLeft=0;s.turnDev=DEV;s.turnExp=explainerOf(s,s.teamIdx);s.turnStart=Date.now();s.timer={running:true,endsAt:Date.now()+ms,left:null,total:ms};draw(s);s.phase='turn'});
}
function correct(){
  if(!guard()||S.current==null)return;const w=S.current;buzz(25);
  act(s=>{if(s.phase!=='turn'||!s.bowl.includes(w))return;takeWord(s,w,s.teamIdx);s.turnGot.push(w);(s.turnLog=s.turnLog||[]).push({t:'got',w,at:Date.now()});afterRemove(s)});
}
function skip(){
  if(!guard()||S.current==null)return;const w=S.current;buzz(15);
  act(s=>{if(s.phase!=='turn'||!s.bowl.includes(w))return;s.bowl=s.bowl.filter(i=>i!==w);(s.roundSkipped=s.roundSkipped||{})[w]=s.teamIdx;
    (s.turnSkipped=s.turnSkipped||[]).push(w);(s.turnLog=s.turnLog||[]).push({t:'skip',w,at:Date.now()});s.scores[s.teamIdx][s.round]--;afterRemove(s)});
}
function undoLast(){
  if(!myTurn())return;
  act(s=>{const e=(s.turnLog||[]).pop();if(!e||s.phase!=='turn')return;
    if(e.t==='got')annulTakenS(s,e.w,true);else unskipS(s,e.w,true);s.current=e.w});
  toast('Angret');
}
function doTimeUp(force){
  act(s=>{if(s.phase!=='turn')return;const t=s.timer;
    if(!force&&t&&(!t.running||t.endsAt-Date.now()>400))return;
    s.steal=s.current!=null?{w:s.current,open:true,by:null,endsAt:Date.now()+10000}:null;
    s.current=null;s.carryLeft=0;s.timer={running:false,endsAt:null,left:0};s.phase='summary'});
}
function stopNow(){if(confirm('Stoppe turen nå?'))doTimeUp(true)}
function steal(i){
  act(s=>{const st=s.steal;if(!st||!st.open)return;
    if(i>=0&&s.bowl.includes(st.w)){takeWord(s,st.w,i);s.steal={w:st.w,open:false,by:i}}else s.steal={w:st.w,open:false,by:null}});
  if(i>=0){buzz(30);toast(S.teams[i]+' stjal lappen!')}
}
function archiveTurn(s){
  const st=s.steal;const stolen=st&&st.by!=null?{w:st.w,by:st.by}:null;
  if(!s.turnDev&&!(s.turnGot||[]).length&&!(s.turnSkipped||[]).length&&!stolen)return;
  const gotSet=new Set(s.turnGot||[]);let prev=s.turnStart||0;const takes=[];
  (s.turnLog||[]).filter(e=>e.at).sort((a,b)=>a.at-b.at).forEach(e=>{if(e.t==='got'&&gotSet.has(e.w)&&prev)takes.push({w:e.w,dt:e.at-prev});prev=e.at});
  (s.history=s.history||[]).push({team:s.teamIdx,round:s.round,exp:s.turnExp||null,got:(s.turnGot||[]).slice(),skipped:(s.turnSkipped||[]).slice(),stolen,takes});
}
function nextTurn(){const ti=S.teamIdx;act(s=>{if(s.phase!=='summary'||s.teamIdx!==ti)return;archiveTurn(s);advanceExp(s,ti);s.teamIdx=nextTeam(ti);resetTurn(s);s.phase='ready'})}
function nextRound(carry){const rd=S.round;act(s=>{if(s.phase!=='summary'||s.round!==rd||s.bowl.length)return;archiveTurn(s);s.round++;fillBowl(s);
  s.carry=!!carry&&s.carryLeft>1000;if(!s.carry){s.carryLeft=0;advanceExp(s,s.teamIdx);s.teamIdx=nextTeam(s.teamIdx)}s.phase='ready'})}
function toFinal(){act(s=>{if(s.phase==='summary'&&!s.bowl.length){archiveTurn(s);s.finalAt=Date.now();s.phase='final'}})}
function endRoundEarly(){
  closeSheet('menu');if(!S||['setup','words','final'].includes(S.phase))return;
  if(!confirm('Avslutte runde '+(S.round+1)+' nå? Lappene som er igjen teller ikke.'))return;
  const rd=S.round;act(s=>{if(s.round!==rd)return;if(s.phase==='summary'){archiveTurn(s);advanceExp(s,s.teamIdx)}if(s.round<2){s.round++;fillBowl(s);s.carry=false;s.carryLeft=0;s.teamIdx=nextTeam(s.teamIdx);s.phase='ready'}else{s.finalAt=Date.now();s.phase='final'}});
}
function restartSameTeams(ask=true){
  closeSheet('menu');
  if(ask&&!confirm('Starte på nytt med nye lapper? Poengene nullstilles, lagene beholdes.'))return;
  act(s=>{s.parti=(s.parti||1)+1;s.slips=[];s.words=[];s.wordBy=[];s.history=[];s.batches=[];s.scores=[];s.bowl=[];s.deleted=[];s.roundTaken={};s.roundSkipped={};resetTurn(s);s.phase='words'});
  LCOUNT=0;EXTRA=false;render();
}

/* judge operations on single slips */
function annulTakenS(s,w,toBowl){const rt=s.roundTaken||{};const team=rt[w];if(team==null)return;delete rt[w];s.scores[team][s.round]--;rm(s.turnGot,w);
  if(s.steal&&s.steal.w===w&&s.steal.by===team)s.steal.by=null;place(s,w,toBowl)}
function unskipS(s,w,toBowl){const rs=s.roundSkipped||{};const team=rs[w];if(team==null)return;delete rs[w];s.scores[team][s.round]++;rm(s.turnSkipped,w);place(s,w,toBowl)}
function statusOf(w){
  if((S.deleted||[]).includes(w))return 'slettet';
  if((S.roundTaken||{})[w]!=null)return 'tatt';
  if((S.roundSkipped||{})[w]!=null)return 'hoppet';
  if(S.phase==='turn'&&S.current===w)return 'scene';
  if(S.steal&&S.steal.open&&S.steal.w===w)return 'scene';
  return 'bolle';
}
function seen(w){return (S.seen||[]).includes(w)}
function label(w){return seen(w)?esc(S.words[w]):'<i style="color:var(--muted)">Skjult lapp</i>'}
function chip(w){const st=statusOf(w);const L={tatt:'Tatt · '+esc(S.teams[(S.roundTaken||{})[w]]||''),hoppet:'Hoppet over',slettet:'Slettet',scene:'På scenen',bolle:'I bollen'};return `<span class="chip ${st}">${L[st]}</span>`}
function wordOp(fn,msg){act(s=>{fn(s);if(s.phase==='turn')afterRemove(s)});closeSheet('wsheet');if(msg)toast(msg)}
function annul(w,toBowl){wordOp(s=>annulTakenS(s,w,toBowl),toBowl?'Annullert, tilbake i bollen':'Annullert og slettet')}
function unskip(w,toBowl){wordOp(s=>unskipS(s,w,toBowl),toBowl?'Tilbake i bollen, +1':'Slettet, +1')}
function delWord(w){wordOp(s=>{if(s.steal&&s.steal.open&&s.steal.w===w)s.steal.open=false;if(s.current===w)s.current=null;place(s,w,false)},'Lappen er slettet')}
function restoreWord(w){wordOp(s=>place(s,w,true),'Tilbake i bollen')}
function saveEdit(w){const v=($('editw').value||'').trim().slice(0,80);if(!v)return;act(s=>{s.words[w]=v});closeSheet('wsheet');toast('Lappen er endret')}
function openWord(w){
  const st=statusOf(w);let b='';
  if(st==='tatt')b=`<button class="btn primary" onclick="annul(${w},true)">Annuller: tilbake i bollen</button><button class="btn bad" onclick="annul(${w},false)">Annuller: slett lappen</button>`;
  else if(st==='hoppet')b=`<button class="btn primary" onclick="unskip(${w},true)">Angre hopp: tilbake i bollen (+1)</button><button class="btn bad" onclick="unskip(${w},false)">Slett lappen (+1)</button>`;
  else if(st==='slettet')b=`<button class="btn primary" onclick="restoreWord(${w})">Legg tilbake i bollen</button>`;
  else b=`<button class="btn bad" onclick="delWord(${w})">Slett lappen fra spillet</button>`;
  const vis=seen(w);
  $('wpanel').innerHTML=`<p class="label">${chip(w)}</p><h2 style="word-break:break-word">${label(w)}</h2>${b}
    ${vis?`<p class="label" style="margin:20px 0 0">Rett skrivefeil</p>
    <input class="field" id="editw" value="${esc(S.words[w])}" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="btn outline" onclick="saveEdit(${w})">Lagre endring</button>`:'<p class="small" style="margin-top:14px">Lappen er ikke tatt ennå, så teksten er skjult for dommeren.</p>'}
    <button class="btn ghost" onclick="closeSheet('wsheet')">Lukk</button>`;
  $('wsheet').classList.add('open');
}
function fixHistS(s,hi,w,kind){
  const h=(s.history||[])[hi];if(!h)return;
  const same=h.round===s.round&&s.phase!=='final';
  if(kind==='bowl'||kind==='del'){
    let team=null;
    if(h.got.includes(w)){team=h.team;rm(h.got,w)}else if(h.stolen&&h.stolen.w===w){team=h.stolen.by;h.stolen=null}
    if(team==null)return;
    s.scores[team][h.round]--;
    if(same){delete (s.roundTaken||{})[w];if(kind==='bowl')place(s,w,true)}
    if(kind==='del')place(s,w,false);
  }else{
    if(!h.skipped.includes(w))return;
    rm(h.skipped,w);s.scores[h.team][h.round]++;
    if(same){delete (s.roundSkipped||{})[w];if(kind==='unskip')place(s,w,true)}
    if(kind==='unskipdel')place(s,w,false);
  }
}
function fixHist(hi,w,kind){act(s=>fixHistS(s,hi,w,kind));closeSheet('wsheet');toast({bowl:'Annullert',del:'Annullert og slettet',unskip:'+1 tilbake',unskipdel:'+1 og slettet'}[kind])}
function histItems(h){const a=h.got.map(w=>({w,k:'got'}));if(h.stolen)a.push({w:h.stolen.w,k:'stolen'});h.skipped.forEach(w=>a.push({w,k:'skip'}));return a}
function histList(hi){
  const h=S.history[hi];const items=histItems(h);
  if(!items.length)return '<p class="empty">Ingen lapper.</p>';
  return `<ul class="list tap">${items.map(({w,k})=>`<li onclick="openHist(${hi},${w})"><span>${label(w)}</span>${k==='got'?'<span class="chip tatt">Tatt</span>':k==='stolen'?`<span class="chip tatt">Stjålet · ${esc(S.teams[h.stolen.by])}</span>`:'<span class="chip hoppet">Hoppet over</span>'}</li>`).join('')}</ul>`;
}
function histNet(h){return h.got.length-h.skipped.length}
function openHist(hi,w){
  const h=S.history[hi];if(!h)return;const same=h.round===S.round;
  const taken=h.got.includes(w)||(h.stolen&&h.stolen.w===w);let b='';
  if(taken)b=same?`<button class="btn primary" onclick="fixHist(${hi},${w},'bowl')">Annuller: tilbake i bollen</button><button class="btn bad" onclick="fixHist(${hi},${w},'del')">Annuller: slett lappen</button>`
    :`<button class="btn primary" onclick="fixHist(${hi},${w},'bowl')">Fjern poenget</button><button class="btn bad" onclick="fixHist(${hi},${w},'del')">Fjern poenget og slett lappen</button>`;
  else b=same?`<button class="btn primary" onclick="fixHist(${hi},${w},'unskip')">Angre hopp: tilbake i bollen (+1)</button><button class="btn bad" onclick="fixHist(${hi},${w},'unskipdel')">Slett lappen (+1)</button>`
    :`<button class="btn primary" onclick="fixHist(${hi},${w},'unskip')">Fjern minuspoenget (+1)</button>`;
  $('wpanel').innerHTML=`<p class="label">Runde ${h.round+1} · ${esc(S.teams[h.team])}</p><h2 style="word-break:break-word">${label(w)}</h2>${b}
    ${seen(w)?`<p class="label" style="margin:20px 0 0">Rett skrivefeil</p><input class="field" id="editw" value="${esc(S.words[w])}" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn outline" onclick="saveEdit(${w})">Lagre endring</button>`:''}
    <button class="btn ghost" onclick="closeSheet('wsheet')">Lukk</button>`;
  $('wsheet').classList.add('open');
}
let SHOWHIST=false;
function adjScore(i,d){const rd=S.round;act(s=>{if(s.round===rd)s.scores[i][rd]+=d})}
/* judge timer controls */
function tPause(){act(s=>{const t=s.timer;if(s.phase!=='turn'||!t||!t.running)return;t.left=Math.max(0,t.endsAt-Date.now());t.running=false;t.endsAt=null})}
function tResume(){act(s=>{const t=s.timer;if(s.phase!=='turn'||!t||t.running)return;t.endsAt=Date.now()+(t.left||0);t.running=true;t.left=null})}
function tAdd(ms){act(s=>{const t=s.timer;if(s.phase!=='turn'||!t)return;if(t.running)t.endsAt=Math.max(Date.now()+1000,t.endsAt+ms);else t.left=Math.max(1000,(t.left||0)+ms)})}

/* ---------- SCENE (simple, for the performer) ---------- */
function sceneTop(){return `<div class="top" style="justify-content:flex-end;margin-bottom:8px"><div class="hdrbtns"><button class="iconbtn" onclick="toggleSound()" aria-label="Lyd">${SOUND?'🔊':'🔇'}</button><button class="iconbtn" onclick="openMenu()">Meny</button></div></div>`}
function vScene(){
  const r=ROUNDS[S.round],team=esc(S.teams[S.teamIdx]);
  if(S.phase==='ready'){
    return sceneTop()+`<span class="pill">Runde ${S.round+1} av 3 · ${r.name}</span>
    <div class="card" style="text-align:center;padding:30px 18px;margin-top:18px">
      <p class="label" style="margin:0">${S.carry?'Fortsetter med resten av tiden':'Nå er det'}</p>
      <h1 class="big-team">${team}</h1>
      ${explainerOf(S,S.teamIdx)?`<p class="exp">${esc(explainerOf(S,S.teamIdx))} ${S.round===1?'mimer':S.round===2?'lager lyden':'forklarer'}</p>`:''}
      <p class="rule" style="margin-top:14px">${r.rule}</p>
      <button class="btn primary xl" onclick="startTurn()">Start${S.carry&&S.carryLeft>1000?' ('+fmt(S.carryLeft)+' s)':''}</button>
    </div>
    <p class="small" style="text-align:center;margin-top:14px">${S.bowl.length} lapper igjen i bollen</p>
    <p class="small kbd">Tastatur: mellomrom for å starte</p>`;
  }
  if(S.phase==='turn'){
    if(!myTurn())return sceneTop()+`<span class="pill">Runde ${S.round+1} · ${r.name}</span>
      <div class="card" style="text-align:center;padding:30px 18px;margin-top:18px"><p class="label" style="margin:0">Spiller nå</p><h1 class="big-team">${team}</h1>
      <div class="tbig tleft"></div><p class="small">${S.bowl.length} lapper igjen</p></div>
      <div class="spacer"></div><button class="btn ghost" onclick="takeOver()">Ta over turen på denne mobilen</button>`;
    return `<div class="turn">
      <div class="turnhead"><span class="pill">${team} · ${r.name}</span><span class="tsm tleft"></span></div>
      <div class="word pop" id="word">${esc(S.words[S.current]??'')}</div>
      ${tally('tally')}
      <div class="btnrow">
        <button class="btn outline xl skipbtn" style="flex-direction:column;gap:2px" ${S.current!=null?'':'disabled'} onclick="skip()">Hopp over<small style="font-size:13px;font-weight:700;opacity:.7">−1 poeng</small></button>
        <button class="btn good xl" onclick="correct()">Riktig ✓</button>
      </div>
      <div class="links">${(S.turnLog||[]).length?'<button onclick="undoLast()">Angre siste</button>':''}</div>
      <p class="small kbd">→ eller mellomrom = Riktig · ← = Hopp over</p>
    </div>`;
  }
  if(S.phase==='summary'){
    const st=S.steal;
    if(st&&st.open){
      const others=S.teams.map((_,i)=>i).filter(i=>i!==S.teamIdx);
      return sceneTop()+`<span class="pill">Tiden er ute!</span>
      <div class="card steal" style="text-align:center">
        <p class="label">Siste lapp: de andre lagene kan stjele</p>
        ${myTurn()?`<div class="stealword">${esc(S.words[st.w])}</div>`:''}
        <div class="cd sleft">10</div>
        ${others.map(i=>`<button class="btn good" onclick="steal(${i})">${esc(S.teams[i])} tok den</button>`).join('')}
        <button class="btn outline" onclick="steal(-1)">Ingen tok den</button></div>`;
    }
    return sceneTop()+doneBlock(true);
  }
  return vAudience();
}
function takeOver(){if(confirm('Ta over turen her? Bruk dette bare hvis performer-skjermen har problemer.'))act(s=>{s.turnDev=DEV;if(s.current==null)draw(s)})}
function tally(cls){const g=(S.turnGot||[]).length,k=(S.turnSkipped||[]).length;return `<div class="${cls}"><span class="tg">✓ ${g} ${g===1?'riktig':'riktige'}</span><span class="tr${k?'':' zero'}">✕ ${k} hoppet over</span></div>`}
function turnNet(){return (S.turnGot||[]).length-(S.turnSkipped||[]).length}
function doneBlock(big){
  const team=esc(S.teams[S.teamIdx]),empty=!S.bowl.length,net=turnNet(),st=S.steal;
  const stolen=st&&st.by!=null?`<p class="small" style="margin:8px 0 0">${esc(S.teams[st.by])} stjal den siste lappen.</p>`:'';
  let h=`<div class="card" style="text-align:center;padding:26px 18px">
    <p class="label" style="margin:0">${empty?'Bollen er tom! Runde '+(S.round+1)+' ferdig':'Tiden er ute'}</p>
    <h1 class="big-team" style="font-size:${big?40:30}px">${team} ${net>=0?'+':''}${net}</h1>${tally('tally')}${stolen}</div>`;
  if(empty&&S.round<2){
    const nx=ROUNDS[S.round+1];
    h+=`<p class="rule"><b>Neste runde: ${nx.name}.</b> Alle lappene går tilbake i bollen.</p>`;
    if(S.carryLeft>1000)h+=`<button class="btn primary" onclick="nextRound(true)">${team} fortsetter (${fmt(S.carryLeft)} s igjen)</button>`;
    h+=`<button class="btn ${S.carryLeft>1000?'outline':'primary'}" onclick="nextRound(false)">Neste lag: ${esc(S.teams[nextTeam(S.teamIdx)])}</button>`;
  }else if(empty)h+=`<button class="btn primary" onclick="toFinal()">Se resultatet</button>`;
  else h+=`<button class="btn primary xl" onclick="nextTurn()">Neste lag: ${esc(S.teams[nextTeam(S.teamIdx)])}</button>`;
  return h;
}

/* ---------- JUDGE (everything) ---------- */
function scoreTable(adj){
  return `<table><thead><tr><th>Lag</th><th>Forkl.</th><th>Mime</th><th>Lyd</th><th>Sum</th></tr></thead><tbody>
  ${S.teams.map((t,i)=>`<tr${i===S.teamIdx&&S.phase!=='final'?' style="background:var(--yellow-soft)"':''}><td>${esc(t)}</td>${(S.scores[i]||[0,0,0]).map((v,r)=>`<td>${adj&&r===S.round?`<button class="mini" onclick="adjScore(${i},-1)">−</button>${v}<button class="mini" onclick="adjScore(${i},1)">+</button>`:v}</td>`).join('')}<td class="tot">${total(i)}</td></tr>`).join('')}
  </tbody></table>`;
}
function wordList(list,empty){
  if(!list.length)return `<p class="empty">${empty}</p>`;
  return `<ul class="list tap">${list.map(w=>`<li onclick="openWord(${w})"><span>${label(w)}</span>${chip(w)}</li>`).join('')}</ul>`;
}
function vJudge(){
  const r=ROUNDS[S.round],team=esc(S.teams[S.teamIdx]),t=S.timer;
  let status,main='';
  if(S.phase==='ready'){
    status=`Venter på at ${team}${explainerOf(S,S.teamIdx)?' ('+esc(explainerOf(S,S.teamIdx))+')':''} trykker Start`;

      ${S.carry&&S.carryLeft>1000?`<p class="small" style="margin:10px 0 0">${team} fortsetter med ${fmt(S.carryLeft)} s.</p>`:''}</div>`;
  }else if(S.phase==='turn'){
    status=`${team} spiller`;
    return header(true)+`<span class="pill">⚖️ Dommer · Runde ${S.round+1} av 3 · ${r.name}</span>
      <div class="card" style="text-align:center;padding:24px 18px;margin-top:18px"><p class="label" style="margin:0">${team} spiller</p>
      <div class="jring"><svg viewBox="0 0 200 200"><circle class="disc" cx="100" cy="100" r="83"/><circle class="trk" cx="100" cy="100" r="90"/><circle class="prg" cx="100" cy="100" r="90" style="stroke-dasharray:${565.49*timeFrac()} 600"/></svg><div class="tbig tleft num" style="font-size:96px"></div></div></div>`;
  }else if(S.phase==='summary'&&S.steal&&S.steal.open){
    status='Siste lapp kan stjeles';
    const others=S.teams.map((_,i)=>i).filter(i=>i!==S.teamIdx);
    main=`<div class="card steal" style="text-align:center"><p class="label">Siste lapp kan stjeles</p><div class="cd sleft">10</div>
      ${others.map(i=>`<button class="btn good" onclick="steal(${i})">${esc(S.teams[i])} tok den</button>`).join('')}

    :(H.length?`<div class="card"><p class="label">Forrige tur · ${esc(S.teams[H[H.length-1].team])} ${histNet(H[H.length-1])>=0?'+':''}${histNet(H[H.length-1])} · trykk for å fikse</p>${histList(H.length-1)}</div>`:'')}
  <div class="card"><p class="label">Poeng · − og + justerer denne runden</p>${scoreTable(true)}</div>

  ${H.length?`<div class="card"><button class="btn outline" style="margin:0" onclick="SHOWHIST=!SHOWHIST;render()">${SHOWHIST?'Skjul':'Vis'} alle turer (${H.length})</button>
    ${SHOWHIST?H.map((h,i)=>i).reverse().map(i=>`<p class="label" style="margin:18px 0 8px">Runde ${H[i].round+1} · ${esc(S.teams[H[i].team])} ${histNet(H[i])>=0?'+':''}${histNet(H[i])}</p>${histList(i)}`).join(''):''}</div>`:''}`}`;
}

/* ---------- CLOCK (TV) ---------- */
function goFull(){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}}
/* Total standings are only shown between rounds, never during the last round. */
function standingsVisible(){
  if(S.phase==='summary'&&!S.bowl.length&&!(S.steal&&S.steal.open))return S.round<2;
  if(S.phase==='ready'&&S.round>0)return !(S.history||[]).some(h=>h.round===S.round);
  return false;
}
const REV_STEP=1700,REV_LEAD=900;
function revealPlan(){
  const idx=rankIdx(),best=total(idx[0]);
  const rest=idx.filter(i=>total(i)<best).reverse(); // last place first, winners (incl. ties) together at the end
  const t0=(S.finalAt||0)+REV_LEAD;const rowAt={};rest.forEach((i,k)=>rowAt[i]=t0+k*REV_STEP);
  const winAt=t0+rest.length*REV_STEP;idx.filter(i=>total(i)===best).forEach(i=>rowAt[i]=winAt);
  return {rowAt,winAt,awAt:winAt+2200,end:winAt+2600};
}
function rankIdx(){return S.teams.map((_,i)=>i).sort((a,b)=>total(b)-total(a)||a-b)}
function placeOf(i){return 1+S.teams.filter((_,j)=>total(j)>total(i)).length}
function revealDone(){return MODE==='local'||!S.finalAt||Date.now()>=revealPlan().end}
let REVEAL_SKIP=false,FINAL_SHOWN=false;
function vClock(){
  const r=ROUNDS[S.round],team=esc(S.teams[S.teamIdx]);let mid;
  if(S.phase==='turn'){const n=(S.turnGot||[]).length;mid=`<p class="clabel">${team}${S.turnExp?' · '+esc(S.turnExp):''} · ${r.name}</p>
    <div class="jring tv"><svg viewBox="0 0 200 200"><circle class="disc" cx="100" cy="100" r="83"/><circle class="trk" cx="100" cy="100" r="90"/><circle class="prg" cx="100" cy="100" r="90" style="stroke-dasharray:${565.49*timeFrac()} 600"/></svg><div class="tbig tleft num"></div></div>
    ${tally('tvtally')}`}
  else if(S.phase==='summary'&&S.steal&&S.steal.open)mid=`<p class="clabel">Siste lapp kan stjeles!</p><div class="tvnum cd sleft">10</div>`;
  else if(S.phase==='summary'){const net=turnNet();const empty=!S.bowl.length;
    mid=`<p class="clabel">${empty?(S.round<2?'Stillingen etter runde '+(S.round+1):'Bollen er tom! 🥁'):'Tiden er ute'}</p><div class="tvteam sm">${team} ${net>=0?'+':''}${net}</div>${tally('tvtally')}
    ${standingsVisible()?tvBoard(-1):empty?'<p class="tvsub">Vinneren avsløres om et øyeblikk …</p>':''}`}
  else{const ex=explainerOf(S,S.teamIdx);const sv=standingsVisible();
    mid=`<p class="clabel">${sv?'Stillingen etter runde '+S.round+' · nå: '+r.name:'Runde '+(S.round+1)+' av 3 · '+r.name}</p><div class="tvteam sm">${team}</div>${ex?`<p class="tvexp">${esc(ex)} ${S.round===1?'mimer':S.round===2?'lager lyden':'forklarer'}</p>`:''}
    ${sv?tvBoard(S.teamIdx):`<p class="tvsub">${S.bowl.length} lapper i bollen${S.round===2?' · stillingen er hemmelig til slutt':''}</p>`}`}
  const needTap=SOUND&&(!AC||AC.state!=='running');
  return `<div class="tv">${mid}${needTap?'<p class="small">Trykk på skjermen for å slå på lyden</p>':''}</div>
  <div class="tvbtns">${document.fullscreenEnabled||document.webkitFullscreenEnabled?'<button class="iconbtn" onclick="goFull()">Fullskjerm</button>':''}<button class="iconbtn" onclick="testSound()">Test lyd</button><button class="iconbtn" onclick="toggleSound()">${SOUND?'🔊':'🔇'}</button><button class="iconbtn" onclick="openMenu()">Meny</button></div>`;
}

function tvBoard(hl){
  return `<div class="tvboard">${S.teams.map((t,i)=>`<div class="tvrow ${i===hl?'on':''}"><div>${esc(t)}${S.useNames&&members(i).length?`<small>${members(i).map(esc).join(', ')}</small>`:''}</div><span>${total(i)}</span></div>`).join('')}</div>`;

function vClockFinal(){
  const idx=rankIdx();const best=total(idx[0]);const win=idx.filter(i=>total(i)===best);
  const A=awards();const P=revealPlan();
  return `<div class="tv tvfin">
    <div class="rv" data-at="${P.winAt}" style="font-size:min(7vmin,64px);line-height:1">🏆</div>

    <div class="tvboard">${idx.map((i,k)=>`<div class="tvrow rv ${total(i)===best?'on':''}" data-at="${P.rowAt[i]}" data-snd="${total(i)===best?'':'row'}"><div><span class="place">${placeOf(i)}.</span> ${esc(S.teams[i])}${S.useNames&&members(i).length?`<small>${members(i).map(esc).join(', ')}</small>`:''}</div><span>${total(i)}</span></div>`).join('')}</div>
    ${A.length?`<div class="tvaw rv" data-at="${P.awAt}">${awardHtml(A)}</div>`:''}</div>
  <div class="tvbtns"><button class="iconbtn" onclick="openMenu()">Meny</button></div>`;
}

/* ---------- AWARDS ---------- */
function awards(){
  const H=S.history||[],A=[],W=w=>'«'+esc(S.words[w])+'»';
  const fmt1=x=>(Math.round(x*10)/10).toString().replace('.',',');
  [['🗣️','Beste forklarer'],['🕺','Beste mimer'],['📣','Beste lydmaker']].forEach(([ic,title],r)=>{
    const ex={};H.forEach(h=>{if(!h.exp||h.round!==r)return;const e=ex[h.exp]||(ex[h.exp]={got:0,turns:0});e.got+=h.got.length;e.turns++});
    const best=Object.entries(ex).sort((a,c)=>(c[1].got/c[1].turns)-(a[1].got/a[1].turns)||c[1].got-a[1].got)[0];
    if(best&&best[1].got)A.push([ic,title,`${esc(best[0])} · ${fmt1(best[1].got/best[1].turns)} lapper per tur (${best[1].got} totalt)`]);
  });
  const ex={};H.forEach(h=>{if(!h.exp)return;const e=ex[h.exp]||(ex[h.exp]={skip:0});e.skip+=h.skipped.length});
  const exs=Object.entries(ex);
  if(exs.length){
    const [sn,sv]=exs.slice().sort((a,c)=>c[1].skip-a[1].skip)[0];
    if(sv.skip)A.push(['🙈','Mest hoppet over',`${esc(sn)} · ${sv.skip} ${sv.skip===1?'gang':'ganger'}`]);
  }
  let f=null;H.forEach(h=>(h.takes||[]).forEach(t=>{if(h.got.includes(t.w)&&t.dt>300&&(!f||t.dt<f.dt))f={...t,exp:h.exp}}));
  if(f)A.push(['⚡','Raskeste lapp',`${W(f.w)} på ${(f.dt/1000).toFixed(1).replace('.',',')} s${f.exp?' · '+esc(f.exp):''}`]);
  const sk={};H.forEach(h=>h.skipped.forEach(w=>sk[w]=(sk[w]||0)+1));
  const hard=Object.entries(sk).sort((a,b)=>b[1]-a[1])[0];
  if(hard)A.push(['🧱','Vanskeligste lapp',`${W(+hard[0])} · hoppet over ${hard[1]} ${hard[1]===1?'gang':'ganger'}`]);
  const st={};H.forEach(h=>{if(h.stolen)st[h.stolen.by]=(st[h.stolen.by]||0)+1});
  const thief=Object.entries(st).sort((a,b)=>b[1]-a[1])[0];
  if(thief)A.push(['🦊','Lappetyvene',`${esc(S.teams[+thief[0]])} · ${thief[1]} ${thief[1]===1?'lapp':'lapper'} stjålet`]);
  if(S.useNames){
    const au={};Object.entries(sk).forEach(([w,n])=>((S.wordBy||[])[+w]||[]).forEach(a=>au[a]=(au[a]||0)+n));
    const sly=Object.entries(au).sort((a,b)=>b[1]-a[1])[0];
    if(sly)A.push(['😈','Lumskeste lappeskriver',`${esc(sly[0])} · lappene ble hoppet over ${sly[1]} ${sly[1]===1?'gang':'ganger'}`]);
  }
  return A;
}
function awardHtml(A){return A.map(([ic,t,d])=>`<div class="aw"><span class="ic">${ic}</span><div><b>${t}</b><span>${d}</span></div></div>`).join('')}
let SHOWWHO=false;
function whoWrote(){
  if(!S.useNames||!(S.wordBy||[]).some(a=>a&&a.length))return '';
  const rows=S.words.map((w,i)=>({w,by:(S.wordBy[i]||[]).join(' og ')||'Ukjent'})).sort((a,b)=>a.by.localeCompare(b.by,'no')||a.w.localeCompare(b.w,'no'));
  return `<div class="card"><button class="btn outline" style="margin:0" onclick="SHOWWHO=!SHOWWHO;render()">${SHOWWHO?'Skjul':'Vis'} hvem som skrev hva</button>
    ${SHOWWHO?`<ul class="list" style="margin-top:12px">${rows.map(r=>`<li><span>${esc(r.w)}</span><span class="chip">${esc(r.by)}</span></li>`).join('')}</ul>`:''}</div>`;
}

/* ---------- AUDIENCE ---------- */
function vAudience(){
  const r=ROUNDS[S.round],team=esc(S.teams[S.teamIdx]);
  const what=S.phase==='turn'?'Spiller nå':S.phase==='ready'?'Neste lag':'Ferdig';
  return header(true)+`<span class="pill">Runde ${S.round+1} av 3 · ${r.name}</span>
  <div class="card" style="text-align:center;padding:26px 18px"><p class="label" style="margin:0">${what}</p><h1 class="big-team">${team}</h1>
    ${S.phase==='turn'?'<div class="tbig tleft"></div>':''}<p class="small" style="margin:8px 0 0">${S.bowl.length} lapper igjen i bollen</p></div>
  ${standingsVisible()?`<div class="card"><p class="label">Stillingen etter runde ${S.phase==='ready'?S.round:S.round+1}</p>${scoreTable(false)}</div>`:'<p class="small" style="text-align:center;margin-top:14px">Stillingen vises mellom rundene.</p>'}`;
}

/* ---------- FINAL ---------- */
function vFinal(){
  if(!revealDone()&&!REVEAL_SKIP){FINAL_SHOWN=false;return header(false)+`<div class="tv"><div class="trophy">🥁</div><h1 style="margin-top:14px">Resultatet avsløres på TV-en</h1>
    <p class="lede">Følg med på skjermen …</p><button class="btn ghost" onclick="REVEAL_SKIP=true;render()">Vis resultatet her nå</button></div>`}
  const idx=S.teams.map((_,i)=>i).sort((a,b)=>total(b)-total(a));
  const best=total(idx[0]);const win=idx.filter(i=>total(i)===best);
  return header(false)+`<div style="text-align:center;margin-top:10px"><div class="trophy">🏆</div>
  <h1 style="margin-top:10px">${win.length>1?'Uavgjort!':esc(S.teams[win[0]])+' vant!'}</h1>
  <p class="lede">${win.length>1?win.map(i=>esc(S.teams[i])).join(' og ')+' med '+best+' poeng hver':best+' poeng totalt'}</p></div>
  <div class="card">${scoreTable(false)}</div>
  ${(()=>{const A=awards();return A.length?`<div class="card"><p class="label">Kveldens priser</p><div class="awards">${awardHtml(A)}</div></div>`:''})()}
  ${whoWrote()}
  <div class="spacer"></div>
  <button class="btn primary" onclick="restartSameTeams(false)">Nytt spill med nye lapper</button>
  <button class="btn outline" onclick="act(beginGame)">Spill igjen med samme lapper</button>
  <button class="btn ghost" onclick="leaveGame()">Avslutt</button>`;
}

/* ---------- MENU ---------- */
function openMenu(){
  const R=[['scene','🎤 Performer'],['dommer','⚖️ Dommer'],['klokke','🖥️ TV'],['tilskuer','👀 Tilskuer']];
  $('menuPanel').innerHTML=`<h2>Meny</h2>
    <p class="label" style="margin:16px 0 0">Denne skjermen er</p>
    <div class="row2">${R.map(([k,l])=>`<button class="btn ${ROLE===k?'primary':'outline'}" onclick="setRole('${k}')">${l}</button>`).join('')}</div>
    <button class="btn outline" onclick="toggleSound();openMenu()">Lyd: ${SOUND?'på 🔊':'av 🔇'}</button>
    ${MODE==='online'?`<button class="btn outline" onclick="shareLink()">Del lenken (kode ${ROOM})</button>`:''}
    <button class="btn outline" onclick="endRoundEarly()">Avslutt denne runden nå</button>
    <button class="btn outline" onclick="restartSameTeams()">Nytt spill med nye lapper</button>
    <button class="btn bad" onclick="leaveGame()">Forlat spillet</button>
    <button class="btn ghost" onclick="closeSheet('menu')">Lukk</button>`;
  $('menu').classList.add('open');
}
function closeSheet(id){$(id).classList.remove('open')}

/* ---------- KEYBOARD (scene on Mac / iPad with keyboard) ---------- */
document.addEventListener('keydown',e=>{
  if(!S||ROLE!=='scene'||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
  if($('menu').classList.contains('open')||$('wsheet').classList.contains('open'))return;
  if(S.phase==='turn'&&myTurn()){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){e.preventDefault();correct()}
    else if(e.key==='ArrowLeft'){e.preventDefault();skip()}
  }else if(S.phase==='ready'&&(e.key===' '||e.key==='Enter')){e.preventDefault();startTurn()}
});

/* ---------- BOOT ---------- */
(function(){const q=new URLSearchParams(location.search).get('r');render();if(q)joinRoom(q)})();
</script>
</body>
