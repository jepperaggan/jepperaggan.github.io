<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vinprofil</title>
<meta name="description" content="Logg viner, bygg smaksprofilen din og få anbefalinger fra vinkartet.">
<meta name="theme-color" content="#F5F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column, 24px gutters, floating translucent tab bar; create/detail as bottom sheets. */
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --ink:#151417; --ink2:#3A373D; --muted:#6B6770; --faint:#9A969E;
  --line:#E2E0E4; --fill:#E8E6EA; --track:#CFCCD2;
  --accent:#7A1F3D; --wine-red:#4A1022; --accent-ink:#FFFFFF; --accent-soft:rgba(122,31,61,.08);
  --bar:rgba(255,255,255,.82); --shadow:rgba(21,20,23,.12); --scrim:rgba(21,20,23,.28); --toast:rgba(21,20,23,.9); --toast-ink:#F5F5F3;
  --font:Geist,-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F0E10; --surface:#1B1A1D; --ink:#F3F2F4; --ink2:#D6D3D9; --muted:#A19DA6; --faint:#77737C;
  --line:#2C2A2F; --fill:#262428; --track:#3A383D;
  --accent:#D9577F; --wine-red:#9C2E4C; --accent-ink:#160A0F; --accent-soft:rgba(217,87,127,.14);
  --bar:rgba(30,29,32,.78); --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); --toast:rgba(243,242,244,.94); --toast-ink:#151417;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F0E10; --surface:#1B1A1D; --ink:#F3F2F4; --ink2:#D6D3D9; --muted:#A19DA6; --faint:#77737C;
  --line:#2C2A2F; --fill:#262428; --track:#3A383D;
  --accent:#D9577F; --wine-red:#9C2E4C; --accent-ink:#160A0F; --accent-soft:rgba(217,87,127,.14);
  --bar:rgba(30,29,32,.78); --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55); --toast:rgba(243,242,244,.94); --toast-ink:#151417;
  color-scheme:dark }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
html.locked,html.locked body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;letter-spacing:inherit;color:var(--ink)}
h1,h2,h3,p{margin:0}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px;letter-spacing:0;line-height:1.45}

/* Press feedback (tens/day: subtle) */
a,button,.press{transition:transform 160ms var(--ease-out),opacity 160ms ease}
.btn:active,.icon-btn:active,.tab:active,.chip:active,.cta:active{transform:scale(.96)}
.row-tap:active{opacity:.55}

/* Screens */
.screen{max-width:560px;margin:0 auto;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 128px)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.head .stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.title{font-size:40px;line-height:1;font-weight:600;letter-spacing:-.04em}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.icon-btn.solid{background:var(--ink);color:var(--bg)}
.icon-btn.ghost{background:var(--surface);box-shadow:0 0 0 .5px var(--shadow);color:var(--ink)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Compact bar when the large title scrolls away */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--st);background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--line);opacity:0;pointer-events:none;transition:opacity 200ms ease}
.topbar.show{opacity:1}
.topbar div{height:44px;display:grid;place-items:center;font-weight:600;font-size:16px}

.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:22px;background:var(--surface);box-shadow:0 0 0 .5px var(--shadow);margin-bottom:22px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}

/* Lists */
.group{margin-bottom:26px}
.group > .eyebrow{display:block;margin-bottom:4px}
.swipe{position:relative;overflow:hidden}
.swipe .actions{position:absolute;top:0;right:0;bottom:0;display:flex}
.swipe:not(.swiping) .actions{visibility:hidden}
.swipe .actions button{width:78px;color:#fff;font-size:15px;font-weight:500;display:grid;place-items:center}
.swipe .actions .a-red{background:#C2283A}
.swipe .actions .a-ink{background:var(--ink);color:var(--bg)}
.swipe.collapsing{transition:height 240ms var(--ease-out),opacity 200ms ease}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);background:var(--bg);width:100%;text-align:left;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.swipe > .row{will-change:transform}
.row.pressed{opacity:.55}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .t1{font-size:16px;font-weight:500;letter-spacing:-.015em;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.row .t2{font-size:13px;color:var(--muted);letter-spacing:0;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.row .t2 span{overflow:hidden;text-overflow:ellipsis}
.rate{font-size:30px;font-weight:250;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.qty{width:30px;font-size:26px;font-weight:250;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;flex:none}
.glass{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.10),inset 0 -5px 9px rgba(0,0,0,.14)}
.glass.sm{width:18px;height:18px}
.glass.lg{width:76px;height:76px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 -10px 18px rgba(0,0,0,.30),0 14px 30px rgba(0,0,0,.18)}
.pending-dot{width:6px;height:6px;border-radius:3px;background:var(--faint);flex:none}
.window{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.window.soon{color:var(--accent)}

/* Empty states */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:28px 0 0}
.empty h2{font-size:24px;font-weight:600;letter-spacing:-.03em}
.empty p{color:var(--muted);max-width:32ch;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:25px;font-size:16px;font-weight:500}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.light{background:var(--surface);color:var(--ink);box-shadow:0 0 0 .5px var(--shadow)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.link{color:var(--accent);font-weight:500;font-size:15px;padding:6px 0}
.link.muted{color:var(--muted)}
.link.danger{color:#C2283A}

/* Tab bar */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 14px);width:calc(100% - 40px);max-width:380px;height:66px;border-radius:33px;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 12px 32px var(--shadow),0 0 0 .5px var(--shadow);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.tab{width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--faint)}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab i{width:4px;height:4px;border-radius:2px;background:transparent}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] i{background:currentColor}
.tab.plus{width:50px;height:50px;border-radius:25px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px var(--accent-soft)}
.tab.plus svg{stroke-width:2.1}
.sync-badge{position:fixed;z-index:29;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 88px);font-size:12px;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:12px;box-shadow:0 0 0 .5px var(--shadow);letter-spacing:0}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;max-width:560px;height:calc(100% - var(--st) - 12px);background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px var(--shadow);display:flex;flex-direction:column;will-change:transform;outline:none}
.sheet-top{flex:none;touch-action:none;cursor:grab}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--track);margin:7px auto 0}
.sheet-head{height:52px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.sheet-head .ttl{font-weight:600}
.sheet-head #sheetLeft{justify-self:start;color:var(--muted)}
.sheet-head #sheetRight{justify-self:end;height:34px;padding:0 16px;border-radius:17px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:500}
.sheet-head #sheetRight.plain{background:transparent;color:var(--ink);padding:0}
.sheet-head #sheetRight:disabled{opacity:.35}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 24px calc(var(--sb) + 40px)}
.sheet-inner{display:flex;flex-direction:column;gap:30px}

/* Form */
.fieldset{display:flex;flex-direction:column;gap:12px}
.name-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:10px}
.name-row input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:26px;font-weight:600;letter-spacing:-.035em}
.name-row input::placeholder{color:var(--faint);font-weight:500}
.meta-line{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);letter-spacing:-.005em;min-height:22px}
.meta-line.empty-meta{color:var(--faint)}
.score{display:flex;align-items:baseline;justify-content:space-between}
.score .big{font-size:80px;line-height:.85;font-weight:200;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.score .word{font-size:15px;font-weight:500;color:var(--accent)}
.ticks{display:flex;align-items:flex-end;justify-content:space-between;height:44px}
.ticks button{width:34px;height:44px;display:flex;align-items:flex-end;justify-content:center}
.tick{width:3px;height:44px;border-radius:2px;background:var(--track);transform-origin:50% 100%;transform:scaleY(.4);transition:transform 200ms var(--ease-out),background-color 160ms ease}
.tick.major{transform:scaleY(.55)}
.tick.below{background:var(--ink)}
.tick.on{background:var(--accent);transform:scaleY(1)}
.tick-nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
.tick-nums span{width:34px;text-align:center}
.tick-nums span.on{color:var(--ink)}
@media (min-resolution:2dppx){.row{border-bottom-width:.5px}}
.note{border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--shadow)}
.note:focus-within{box-shadow:0 0 0 1.5px var(--ink)}
.note textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:14px 16px;font-size:16px;line-height:1.45;outline:none;min-height:132px}
.note textarea::placeholder{color:var(--faint)}
.details-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:15px;font-weight:500;padding:4px 0}
.details-toggle svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;transition:transform 200ms var(--ease-out)}
.details-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.fields{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--shadow);overflow:hidden}
.f{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;border-bottom:.5px solid var(--line)}
.f:last-child{border-bottom:0}
.f > span{width:6.5rem;flex:none;font-size:15px;color:var(--muted)}
.f input,.f select{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;text-align:right;padding:12px 0;-webkit-appearance:none;appearance:none}
.f input::placeholder{color:var(--faint)}
.types{display:flex;justify-content:space-between;gap:4px}
.types button{width:52px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:var(--muted);letter-spacing:0}
.types button .glass{transition:box-shadow 160ms ease}
.types button[aria-checked="true"]{color:var(--ink)}
.types button[aria-checked="true"] .glass{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.seg{position:relative;display:flex;padding:3px;border-radius:18px;background:var(--fill)}
.seg .thumb{position:absolute;top:3px;left:3px;bottom:3px;border-radius:15px;background:var(--surface);box-shadow:0 1px 3px var(--shadow),0 0 0 .5px var(--shadow);transition:transform 260ms var(--ease-in-out)}
.seg button{position:relative;flex:1;height:30px;border-radius:15px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;padding:0 12px}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{color:var(--ink)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 16px}
.switch{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;margin:0;cursor:pointer;transition:background-color 200ms ease}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform 260ms var(--ease-out)}
.switch:checked{background:var(--ink)}
.switch:checked::after{transform:translateX(20px)}
.hint{font-size:13px;line-height:1.45;color:var(--muted);letter-spacing:0}
.err{font-size:14px;color:#C2283A;letter-spacing:0}
.scan-status{font-size:13px;color:var(--muted);letter-spacing:0}

/* Detail */
.d-head{display:flex;align-items:center;gap:18px}
.d-head .stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.d-head h2{font-size:26px;line-height:1.08;font-weight:600;letter-spacing:-.035em}
.d-score{display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:20px;border-bottom:.5px solid var(--line)}
.d-score .big{font-size:88px;line-height:.85;font-weight:200;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.d-score .of{font-size:18px;font-weight:300;color:var(--faint)}
.d-score .word{font-size:15px;font-weight:500;color:var(--accent);padding-bottom:6px}
.quote{font-size:17px;line-height:1.45;letter-spacing:-.015em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;background:var(--fill);font-size:13px;font-weight:500;letter-spacing:0}
.tag.neg{background:var(--accent-soft);color:var(--accent)}
.dims{display:flex;flex-direction:column;gap:10px}
.dim{display:grid;grid-template-columns:64px minmax(0,1fr) 54px;align-items:center;gap:12px}
.dim .l{font-size:14px;font-weight:500}
.dim .bars{display:flex;gap:5px}
.dim .bars i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.dim .bars i.on{background:var(--ink)}
.dim .w{font-size:12px;color:var(--muted);text-align:right;letter-spacing:0}
.skeleton{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--line) 0%,var(--fill) 50%,var(--line) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.facts div{display:flex;flex-direction:column;gap:4px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-size:15px;font-weight:500}
.actions-row{display:flex;gap:10px}
.actions-row .btn{flex:1}
.stepper{display:flex;border-radius:18px;background:var(--fill);overflow:hidden}
.stepper button{width:46px;height:36px;display:grid;place-items:center;font-size:20px}
.stepper button:disabled{color:var(--faint)}

/* Profile */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:26px}
.stats div{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats .v{font-size:40px;line-height:1;font-weight:200;letter-spacing:-.05em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .v.word{font-size:22px;line-height:1.6;font-weight:500;letter-spacing:-.03em}
.stats .k{font-size:12px;color:var(--muted);letter-spacing:0}
.stats .fav{display:inline-flex;flex-direction:column;align-self:flex-start;max-width:100%;gap:1px}
.fstripe{display:flex;gap:1.5px;height:3px;width:100%;border-radius:1.5px;overflow:hidden;margin:0 0 3px}
.fstripe i{min-width:2px}
.fstripe i.w{box-shadow:inset 0 0 0 .5px var(--shadow)}
.next-cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 16px 16px 14px;margin:2px 0 20px;border-radius:20px;background:var(--accent-soft);color:var(--ink);transition:transform 160ms ease}
.next-cta .ic{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.next-cta .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.next-cta .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.next-cta b{font-size:16px;font-weight:600;letter-spacing:-.015em}
.next-cta .tx span{font-size:13px;color:var(--muted)}
.next-cta .chev{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.next-cta:active{transform:scale(.98)}
.settings-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:26px;padding:15px 16px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 .5px var(--shadow);font-size:16px;text-align:left}
.settings-btn .v{margin-left:auto;color:var(--muted);font-size:15px}
.settings-btn .gear{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.settings-btn .chev{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.panel{padding:18px 0;border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:12px}
.panel:last-child{border-bottom:.5px solid var(--line)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);letter-spacing:0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:2px}
.radar svg{width:100%;height:auto;display:block}
.ai-text{font-size:17px;line-height:1.45;letter-spacing:-.015em;white-space:pre-wrap}
.list-rows{display:flex;flex-direction:column}
.list-rows > *{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:.5px solid var(--line);font-size:15px;text-align:left;width:100%}
.list-rows > *:last-child{border-bottom:0}
.list-rows .v{color:var(--muted)}

/* Råd */
.photos{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photos img{width:56px;height:72px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 .5px var(--shadow)}
.add-photo{width:56px;height:72px;border-radius:8px;border:1px dashed var(--track);display:grid;place-items:center;color:var(--muted)}
.add-photo svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.chips{display:flex;flex-wrap:wrap;gap:8px}
/* Felt med stikkord-bobler: forslag nederst i samme kort, valgte og egne stikkord som bobler med x */
.tagbox{border-radius:18px;background:var(--surface);box-shadow:0 0 0 .5px var(--shadow);transition:box-shadow 160ms ease}
.tagbox:focus-within{box-shadow:0 0 0 1.5px var(--ink)}
.tagbox .tf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 12px 10px 14px;min-height:56px;cursor:text}
.tagbox textarea{flex:1 1 140px;min-width:120px;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.4;padding:5px 2px;height:32px;overflow:hidden}
.tagbox textarea::placeholder{color:var(--faint)}
.tok{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 12px;border-radius:16px;background:var(--accent-soft);color:var(--ink);font-size:14px;letter-spacing:-.005em;animation:tok-in 200ms var(--ease-out) both}
.tok button{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;color:var(--muted)}
.tok button svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
@keyframes tok-in{from{opacity:0;transform:scale(.92)}}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 12px;border-top:.5px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
.sugg button{flex:none;height:30px;padding:0 12px;border-radius:15px;background:var(--fill);font-size:13px;color:var(--muted);letter-spacing:0}
.sugg button::before{content:"+ ";color:var(--faint)}
.chip{height:32px;padding:0 13px;border-radius:16px;background:var(--fill);font-size:13px;letter-spacing:0}
.progress{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(1turn)}}
.think{width:20px;height:20px;flex:none;color:var(--accent);display:inline-block}
.think.sm{width:15px;height:15px}
.think.xs{width:13px;height:13px;margin-left:-2px}
.think svg{display:block;width:100%;height:100%;overflow:visible;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.think .s0{fill:currentColor;fill-opacity:.16;transform-box:fill-box;transform-origin:center;animation:think-breathe 1.6s var(--ease-in-out) infinite}
.think .s1,.think .s2{transform-box:fill-box;transform-origin:center;animation:think-twinkle 1.6s ease-in-out infinite}
.think .s2{animation-delay:-.8s}
@keyframes think-breathe{0%,100%{transform:scale(.8) rotate(0deg)}50%{transform:scale(1) rotate(14deg)}}
@keyframes think-twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes think-fade{0%,100%{opacity:.35}50%{opacity:1}}
.think-txt{transition:opacity 200ms ease}
.pick{display:flex;flex-direction:column;gap:9px;padding:18px 0;border-top:.5px solid var(--line)}
.pick .top{display:flex;align-items:flex-start;gap:14px}
.pick .glass{width:30px;height:30px}
.pick .nm{font-size:16px;font-weight:500;letter-spacing:-.015em}
.pick .pct{font-size:30px;line-height:1;font-weight:250;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick .pct small{font-size:14px;font-weight:400;color:var(--faint);letter-spacing:0}
.pick .why{margin-left:44px;font-size:14px;line-height:1.45;color:var(--ink2);letter-spacing:0}
.pick .acts{margin-left:44px;display:flex;gap:18px;flex-wrap:wrap}
.skip{display:flex;gap:10px;align-items:baseline;padding-top:16px;border-top:.5px solid var(--line);font-size:14px;color:var(--ink2);letter-spacing:0}
.skip .eyebrow{color:var(--accent);flex:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise 260ms var(--ease-out) both}

/* Kjeller */
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-bottom:10px}
#tab-kjeller .head .stack{flex:1}
#tab-rad .head{flex-direction:column;align-items:stretch;gap:16px}
.rings{display:flex;gap:10px;align-self:center;margin-bottom:-4px}
.rings:empty{display:none}
.ring{width:46px;height:46px;display:block}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--track)}
.ring text{font:600 13px/1 var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central;letter-spacing:-.02em}
.dist-legend.two{flex-direction:column;gap:8px}
.dist-legend .ln{display:flex;flex-wrap:wrap;gap:6px 16px}
.dist span{min-width:2px}
.dist-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);letter-spacing:0;margin-bottom:26px}
.dist-legend span{display:flex;align-items:center;gap:6px}
.dist-legend i{width:8px;height:8px;border-radius:4px}
.dist-legend b{color:var(--ink);font-weight:500}

/* Login */
.login{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 24px)}
.login-in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:26px}
.login .glass.lg{background:radial-gradient(circle at 34% 28%,#B04A66 0%,#6A1A2E 52%,#300814 100%)}
.login .title{font-size:44px}
.login .fields .f > span{width:5.5rem}
.login .fields input{text-align:left}
.noacct{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:-8px}
.noacct .link{font-size:15px}
.noacct-msg{margin:0;width:100%;padding:13px 16px;border-radius:14px;background:var(--fill);color:var(--ink);font-size:15px;text-align:center;animation:ask-in 220ms var(--ease-out) both}
@keyframes ask-in{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@media (prefers-reduced-motion: reduce){.noacct-msg{animation:fade 200ms ease both}}

/* Banner + toast */
.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;letter-spacing:0;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:50;display:flex;align-items:center;gap:16px;max-width:calc(100% - 40px);padding:12px 18px;border-radius:22px;background:var(--toast);color:var(--toast-ink);font-size:15px;font-weight:500;box-shadow:0 8px 24px var(--shadow);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity 200ms ease,transform 300ms var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:600}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet:focus{outline:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important}
  .rise{animation:fade 200ms ease both}
  .btn:active,.icon-btn:active,.tab:active,.chip:active,.cta:active{transform:none;opacity:.6}
  .toast{transform:translate(-50%,0)!important;transition:opacity 200ms ease!important}
  .skeleton,.spin{animation:none}
  .think .s0,.think .s1,.think .s2{animation:think-fade 2s ease-in-out infinite;transform:none}
}
@media (prefers-reduced-transparency: reduce){
  .tabbar,.topbar{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <form class="login-in" id="loginForm" novalidate>
    <div class="glass lg" aria-hidden="true"></div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 class="title" data-i18n="app.name">Vinprofil</h1>
      <p class="muted" id="lg_lead" data-i18n="login.lead">Logg inn for å komme til vinene dine.</p>
    </div>
    <div class="fields">
      <label class="f"><span data-i18n="login.user">Bruker</span><input id="lg_user" data-i18n-ph="login.userPh" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Brukernavn"></label>
      <label class="f"><span data-i18n="login.pass">Passord</span><input id="lg_pass" type="password" autocomplete="current-password" placeholder="Passord" data-i18n-ph="login.pass"></label>
    </div>
    <p class="err" id="lg_err" hidden></p>
    <button class="btn dark block" id="lg_go" type="submit" data-i18n="login.go">Logg inn</button>
    <div class="noacct">
      <button type="button" class="link muted" id="lg_noacct" aria-expanded="false" aria-controls="lg_ask" data-i18n="login.noAccount">Har du ikke konto?</button>
      <p class="noacct-msg" id="lg_ask" role="status" hidden data-i18n="login.askJeppe">Spør Jeppe om du kan få en konto.</p>
    </div>
  </form>
</div>

<div id="app" hidden>
  <div class="topbar" id="topbar" aria-hidden="true"><div id="topbarTitle" data-i18n="title.log">Logg</div></div>

  <main>
    <section class="screen" id="tab-logg">
      <div class="head">
        <div class="stack"><span class="eyebrow" id="logEyebrow"></span><h1 class="title" data-i18n="title.log">Logg</h1></div>
        <button class="icon-btn solid" type="button" id="avatarBtn" aria-label="Profil" data-i18n-aria="title.profile"></button>
      </div>
      <div id="offlineBanner" class="banner" hidden data-i18n="log.offline">Du er uten nett. Det du lagrer nå sendes når du er på nett igjen.</div>
      <label class="search" id="logSearchWrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg><input type="search" id="logSearch" data-i18n-ph="log.search" data-i18n-aria="log.search" placeholder="Søk i vinene dine" aria-label="Søk i vinene dine" autocomplete="off"></label>
      <div id="wineList"></div>
    </section>

    <section class="screen" id="tab-profil" hidden>
      <div class="head"><div class="stack"><span class="eyebrow" id="profEyebrow"></span><h1 class="title" data-i18n="title.profile">Din smaksprofil</h1></div></div>
      <div id="profileBody"></div>
    </section>

    <section class="screen" id="tab-rad" hidden>
      <div class="head">
        <h1 class="title" data-i18n="title.sommelier">Sommelier</h1>
        <div class="seg" role="tablist" aria-label="Type råd" data-i18n-aria="s.modeAria" id="radSeg">
          <span class="thumb"></span>
          <button type="button" role="tab" aria-selected="true" data-mode="menu" data-i18n="s.menu">Vinkart</button>
          <button type="button" role="tab" aria-selected="false" data-mode="buy" data-i18n="s.buy">Kjøp</button>
        </div>
      </div>

      <div id="menuPane" style="display:flex;flex-direction:column;gap:22px">
        <div class="photos" id="menuPhotos">
          <label class="add-photo" for="menuInput" aria-label="Ta bilde av vinkartet" data-i18n-aria="s.photoAria"><svg viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></label>
          <span class="hint" id="menuHint" data-i18n="s.photoHint">Ta bilde av vinkartet. Flere sider går fint.</span>
        </div>
        <input type="file" id="menuInput" accept="image/*" multiple hidden>
        <div class="fieldset">
          <label class="eyebrow" for="menuIntent" data-i18n="s.tonight">I kveld</label>
          <div class="tagbox" id="menuBox"><div class="tf"><textarea id="menuIntent" rows="1" enterkeyhint="done" data-i18n-ph="s.tonightPh" placeholder="Til lam, rundt 900 kr, noe nytt"></textarea></div><div class="sugg" id="menuChips"></div></div>
        </div>
        <button class="btn dark block" id="menuGo" type="button" data-i18n="s.findWine">Finn vinen min</button>
        <div class="progress" id="menuStatus" hidden><span class="think"></span><span class="think-txt" data-i18n-phrases="s.menuThinking" data-phrases="Leser vinkartet|Sammenligner med smaken din|Velger de beste">Leser vinkartet</span><button class="link muted" id="menuStop" type="button" style="margin-left:auto" data-i18n="c.stop">Stopp</button></div>
        <p class="err" id="menuErr" hidden></p>
        <div id="menuOut"></div>
      </div>

      <div id="buyPane" style="display:flex;flex-direction:column;gap:22px" hidden>
        <div class="fieldset">
          <label class="eyebrow" for="buyIntent" data-i18n="s.occasion">Anledning</label>
          <div class="tagbox" id="buyBox"><div class="tf"><textarea id="buyIntent" rows="1" enterkeyhint="done" data-i18n-ph="s.occasionPh" placeholder="Fredagstaco med venner, noe saftig"></textarea></div><div class="sugg" id="buyChips"></div></div>
        </div>
        <div class="fields">
          <label class="f"><span data-i18n="s.budget">Budsjett</span><input id="buyBudget" type="number" inputmode="numeric" min="0" placeholder="kr per flaske" data-i18n-ph="s.perBottle"></label>
          <div class="switch-row"><label for="buyCellar" style="font-size:15px;color:var(--muted)" data-i18n="s.cellarFirst">Se i kjelleren først</label><input type="checkbox" class="switch" id="buyCellar" checked></div>
        </div>
        <div class="seg" role="radiogroup" aria-label="Hvor kjøper du?" data-i18n-aria="s.whereAria" id="buyWhere">
          <span class="thumb"></span>
          <button type="button" role="radio" aria-checked="true" data-v="no">Vinmonopolet</button>
          <button type="button" role="radio" aria-checked="false" data-v="fr">Frankrike</button>
          <button type="button" role="radio" aria-checked="false" data-v="other">Annet</button>
        </div>
        <button class="btn dark block" id="buyGo" type="button" data-i18n="s.go">Gi meg forslag</button>
        <div class="progress" id="buyStatus" hidden><span class="think"></span><span class="think-txt" data-i18n-phrases="s.buyThinking" data-phrases="Tenker på smaken din|Leter etter flasker|Velger de beste">Tenker på smaken din</span><button class="link muted" id="buyStop" type="button" style="margin-left:auto" data-i18n="c.stop">Stopp</button></div>
        <p class="err" id="buyErr" hidden></p>
        <div id="buyOut"></div>
      </div>
    </section>

    <section class="screen" id="tab-kjeller" hidden>
      <div class="head">
        <div class="stack"><span class="eyebrow" id="cellarEyebrow"></span><h1 class="title" data-i18n="title.cellar">Vinkjeller</h1></div>
        <div class="rings" id="cellarRings" aria-hidden="true"></div>
        <button class="icon-btn ghost" type="button" id="addBottleBtn" aria-label="Ny flaske" data-i18n-aria="nav.newBottle"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <div id="cellarBody"></div>
    </section>
  </main>

  <div class="sync-badge" id="syncBadge" hidden></div>

  <nav class="tabbar" aria-label="Seksjoner" data-i18n-aria="nav.sections">
    <button class="tab" type="button" data-tab="logg" aria-label="Historikk" data-i18n-aria="tab.log" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"></path><path d="M3.2 4.6v4.1h4.1"></path><path d="M12 7.5V12l3 1.8"></path></svg><i></i></button>
    <button class="tab" type="button" data-tab="profil" aria-label="Din smaksprofil" data-i18n-aria="title.profile"><svg viewBox="0 0 24 24"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"></path><path d="M12 8l3.5 2.5-1.3 4.2H9.8L8.5 10.5z"></path></svg><i></i></button>
    <button class="tab plus" type="button" id="plusBtn" aria-label="Ny vin" data-i18n-aria="nav.newWine"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button class="tab" type="button" data-tab="rad" aria-label="Sommelier" data-i18n-aria="title.sommelier"><svg viewBox="0 0 24 24"><path d="M10 3.5l1.6 4.6a3 3 0 0 0 1.8 1.8L18 11.5l-4.6 1.6a3 3 0 0 0-1.8 1.8L10 19.5l-1.6-4.6a3 3 0 0 0-1.8-1.8L2 11.5l4.6-1.6a3 3 0 0 0 1.8-1.8z"></path><path d="M18.5 2.5v4M16.5 4.5h4"></path><path d="M19 16.5v3M17.5 18h3"></path></svg><i></i></button>
    <button class="tab" type="button" data-tab="kjeller" aria-label="Vinkjeller" data-i18n-aria="title.cellar"><svg viewBox="0 0 24 24"><g transform="translate(-1.2 0)"><g fill="currentColor" stroke="none"><g transform="rotate(20 19.4 7.6)"><path d="M7.80 5.65H14.40C15.50 5.65 15.30 6.80 16.40 6.80H19.40a0.80 0.80 0 0 1 0 1.60H16.40C15.30 8.40 15.50 9.55 14.40 9.55H7.80a.8 .8 0 0 1 -.8 -.8v-2.30a.8 .8 0 0 1 .8 -.8z"/></g><g transform="rotate(20 19.4 13.2)"><path d="M7.80 11.25H14.40C15.50 11.25 15.30 12.40 16.40 12.40H19.40a0.80 0.80 0 0 1 0 1.60H16.40C15.30 14.00 15.50 15.15 14.40 15.15H7.80a.8 .8 0 0 1 -.8 -.8v-2.30a.8 .8 0 0 1 .8 -.8z"/></g><g transform="rotate(20 19.4 18.8)"><path d="M7.80 16.85H14.40C15.50 16.85 15.30 18.00 16.40 18.00H19.40a0.80 0.80 0 0 1 0 1.60H16.40C15.30 19.60 15.50 20.75 14.40 20.75H7.80a.8 .8 0 0 1 -.8 -.8v-2.30a.8 .8 0 0 1 .8 -.8z"/></g></g><path d="M21.2 2.5v19"/><path d="M18.3 5.9v3.4"/><path d="M18.3 11.5v3.4"/><path d="M18.3 17.1v3.4"/></g></svg><i></i></button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <div class="sheet-top" id="sheetTop">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-head">
      <button type="button" id="sheetLeft">Avbryt</button>
      <span class="ttl" id="sheetTitle"></span>
      <button type="button" id="sheetRight">Lagre</button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button type="button" id="toastBtn" hidden></button></div>

<script src="i18n.js"></script>
<script src="supabase.js"></script>

</body>
