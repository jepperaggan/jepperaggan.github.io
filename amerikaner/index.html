<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amerikaner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#163829">
<title>Amerikaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#163829; --felt-2:#1d4733; --felt-3:#24563e;
  --card:#FBF8F2; --card-2:#E9E3D6; --ink:#1b2a22; --muted:#6c7a70;
  --gold:#D6B25E; --gold-soft:rgba(214,178,94,.18); --neg:#b5523f;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --felt:#0f2a1e; --felt-2:#153626; --felt-3:#1b4430; }
}
:root[data-theme="dark"]{ --felt:#0f2a1e; --felt-2:#153626; --felt-3:#1b4430; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--felt);color:var(--card);font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;max-width:760px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em}
.iconbtn{width:42px;height:42px;border-radius:21px;background:var(--felt-2);display:grid;place-items:center;font-size:1.25rem}

main{max-width:760px;margin:0 auto;padding:0 12px 120px}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:100%;table-layout:fixed}
th,td{text-align:center;padding:0}
col.rcol{width:44px}
thead th{background:var(--card-2);font-weight:600;font-size:.9rem;padding:12px 4px;border-bottom:1px solid #d8d0bf;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th.name{cursor:pointer}
tbody td.r{font-family:var(--serif);color:var(--muted);font-size:.85rem;border-right:1px solid #e6dfd0}
tbody tr+tr td{border-top:1px solid #eee8db}
td.cell button{width:100%;height:48px;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
td.cell button.neg{color:var(--neg)}
td.cell button.empty{color:#c9c0ad}
td.cell button.active{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold)}
td.best{background:linear-gradient(transparent,transparent),rgba(214,178,94,.10)}
tfoot td{background:var(--felt-3);color:var(--card);padding:12px 4px;font-family:var(--serif);font-size:1.5rem}
tfoot td.r{font-family:var(--sans);font-size:.75rem;color:#b9cbbf}
tfoot td.lead{color:var(--gold)}
tfoot td.lead::after{content:"";display:block;width:22px;height:2px;margin:4px auto 0;background:var(--gold);border-radius:2px}

table.many thead th{font-size:.8rem;padding:12px 2px}
table.many td.cell button{font-size:1.02rem}
table.many tfoot td{font-size:1.2rem}
table.many tfoot td.r{font-size:.75rem}
.addround{display:block;width:100%;margin:14px 0 0;padding:15px;border-radius:14px;border:1.5px dashed rgba(251,248,242,.35);
  color:var(--card);font-weight:600;font-size:1rem}
.hint{color:#9fb7a8;font-size:.85rem;text-align:center;margin:14px 0 0}

/* keypad */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s}
.backdrop.open{opacity:1;pointer-events:auto}
.pad,.menu{position:fixed;left:0;right:0;bottom:0;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;
  max-width:560px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.pad.open,.menu.open{transform:none}
.padhead{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 10px}
.padwho{font-weight:600}
.padround{color:var(--muted);font-size:.9rem}
.display{font-family:var(--serif);font-size:2.6rem;text-align:right;background:var(--card-2);border-radius:12px;padding:6px 16px;min-height:66px;margin-bottom:10px}
.display.neg{color:var(--neg)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:54px;border-radius:12px;background:#fff;border:1px solid #e3dccd;font-size:1.35rem;font-family:var(--serif)}
.keys button.fn{font-family:var(--sans);font-size:1rem;font-weight:600;background:var(--card-2)}
.keys button.go{background:var(--felt);color:var(--card);border-color:var(--felt);font-family:var(--sans);font-weight:600;font-size:1rem}
.keys .wide{grid-column:span 2}
@media (prefers-reduced-motion: reduce){.pad,.menu,.backdrop{transition:none}}

/* menu */
.menu h2{font-family:var(--serif);font-weight:400;font-size:1.4rem;margin:4px 4px 12px}
.prow{display:flex;gap:8px;margin-bottom:8px}
.prow input{flex:1;font:inherit;font-size:1rem;padding:12px;border-radius:10px;border:1px solid #d8d0bf;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.prow button{width:46px;border-radius:10px;background:var(--card-2);font-size:1.2rem}
.mbtn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:600;margin-top:8px;background:var(--card-2);text-align:center}
.mbtn.dark{background:var(--felt);color:var(--card)}
.mbtn.danger{color:var(--neg)}
.mbtn:disabled{opacity:.4}
.credit{text-align:center;color:var(--muted);font-size:.75rem;margin-top:12px}
</style>
</head>
<body>
<header>
  <h1>Amerikaner</h1>
  <button class="iconbtn" id="menuBtn" aria-label="Meny">☰</button>
</header>

<main>
  <div class="sheet"><div class="scroll"><table id="tbl"></table></div></div>
  <button class="addround" id="addRound">+ Ny runde</button>
  <p class="hint" id="hint">Trykk på en rute for å skrive poeng. Bruk ± for minuspoeng.</p>
</main>

<div class="backdrop" id="backdrop"></div>

<div class="pad" id="pad" role="dialog" aria-label="Skriv poeng">
  <div class="padhead"><span class="padwho" id="padWho"></span><span class="padround" id="padRound"></span></div>
  <div class="display" id="display"></div>
  <div class="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="pm" class="fn">±</button><button data-k="0">0</button><button data-k="bs" class="fn">⌫</button>
    <button data-k="clr" class="fn">Tøm</button><button data-k="next" class="go wide">Neste</button>
  </div>
</div>

<div class="menu" id="menu" role="dialog" aria-label="Meny">
  <h2>Spillere</h2>
  <div id="plist"></div>
  <button class="mbtn" id="addPlayer">+ Legg til spiller</button>
  <button class="mbtn" id="delRound">Slett siste runde</button>
  <button class="mbtn danger" id="newGame">Nytt spill</button>
  <button class="mbtn dark" id="closeMenu">Ferdig</button>
  <div class="credit">utviklet av JayPee Designs</div>
</div>

<script>
const KEY="amerikaner-v1";
let S=load()||{players:["Spiller 1","Spiller 2","Spiller 3","Spiller 4"],rounds:[[null,null,null,null]]};
let cur=null, buf="";

function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function totals(){return S.players.map((_,p)=>S.rounds.reduce((a,r)=>a+(r[p]||0),0))}

function render(){
  const n=S.players.length, t=totals();
  const max=Math.max(...t), anyScore=S.rounds.some(r=>r.some(v=>v!==null&&v!==0));
  let h='<colgroup><col class="rcol">'+S.players.map(()=>'<col>').join('')+'</colgroup>';
  h+='<thead><tr><th></th>'+S.players.map((p,i)=>`<th class="name" data-p="${i}">${esc(p)}</th>`).join('')+'</tr></thead><tbody>';
  S.rounds.forEach((r,ri)=>{
    const vals=r.map(v=>v===null?null:v), rmax=Math.max(...vals.map(v=>v??-Infinity));
    h+=`<tr><td class="r">${ri+1}</td>`;
    for(let p=0;p<n;p++){
      const v=r[p], act=cur&&cur.r===ri&&cur.p===p;
      const shown=act?(buf===""||buf==="-"?(buf||"–"):buf):(v===null?"–":v);
      const cls=[act?"active":"", (act?buf.startsWith("-"):v<0)?"neg":"", (!act&&v===null)?"empty":""].join(" ");
      const best=v!==null&&v===rmax&&r.every(x=>x!==null)&&v>0;
      h+=`<td class="cell${best?" best":""}"><button class="${cls}" data-r="${ri}" data-p="${p}" aria-label="${esc(S.players[p])}, runde ${ri+1}">${shown}</button></td>`;
    }
    h+='</tr>';
  });
  h+='</tbody><tfoot><tr><td class="r">Sum</td>'+t.map(v=>`<td class="${anyScore&&v===max?"lead":""}">${v}</td>`).join('')+'</tr></tfoot>';
  $("tbl").innerHTML=h;
  $("tbl").classList.toggle("many",n>=5);
  $("hint").style.display=anyScore?"none":"";
}

/* keypad */
function openPad(r,p){
  commit();
  cur={r,p}; const v=S.rounds[r][p]; buf=v===null?"":String(v);
  $("padWho").textContent=S.players[p]; $("padRound").textContent="Runde "+(r+1);
  updDisplay(); $("pad").classList.add("open"); $("backdrop").classList.add("open"); render();
}
function updDisplay(){const d=$("display");d.textContent=buf===""?"0":buf;d.classList.toggle("neg",buf.startsWith("-"))}
function commit(){
  if(!cur)return;
  const n=parseInt(buf,10);
  S.rounds[cur.r][cur.p]=isNaN(n)?null:n; save();
}
function closePad(){commit();cur=null;$("pad").classList.remove("open");if(!$("menu").classList.contains("open"))$("backdrop").classList.remove("open");render()}
function next(){
  commit(); let {r,p}=cur; p++;
  if(p>=S.players.length){p=0;r++; if(r>=S.rounds.length){cur=null;closePad();return}}
  openPad(r,p);
}
document.querySelector(".keys").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||!cur)return; const k=b.dataset.k;
  if(/^\d$/.test(k)){ if(buf.replace("-","").length<4) buf=(buf==="0"?"":buf==="-0"?"-":buf)+k; }
  else if(k==="pm"){ buf=buf.startsWith("-")?buf.slice(1):"-"+buf; }
  else if(k==="bs"){ buf=buf.slice(0,-1); }
  else if(k==="clr"){ buf=""; }
  else if(k==="next"){ next(); return; }
  updDisplay(); render();
});

$("tbl").addEventListener("click",e=>{
  const b=e.target.closest("td.cell button");
  if(b){openPad(+b.dataset.r,+b.dataset.p);return}
  const th=e.target.closest("th.name"); if(th) openMenu();
});
$("addRound").onclick=()=>{
  commit(); S.rounds.push(S.players.map(()=>null)); save();
  openPad(S.rounds.length-1,0);
  requestAnimationFrame(()=>window.scrollTo({top:document.body.scrollHeight}));
};
$("backdrop").onclick=()=>{ if($("menu").classList.contains("open")) closeMenu(); else closePad(); };

/* menu */
function renderPlayers(){
  $("plist").innerHTML=S.players.map((p,i)=>`<div class="prow"><input value="${esc(p)}" data-i="${i}" maxlength="14" aria-label="Navn spiller ${i+1}"><button data-del="${i}" aria-label="Fjern ${esc(p)}" ${S.players.length<=2?"disabled":""}>✕</button></div>`).join('');
  $("addPlayer").disabled=S.players.length>=6;
  $("delRound").disabled=S.rounds.length<=1;
}
function openMenu(){closePadQuiet();renderPlayers();$("menu").classList.add("open");$("backdrop").classList.add("open")}
function closePadQuiet(){commit();cur=null;$("pad").classList.remove("open")}
function closeMenu(){$("menu").classList.remove("open");$("backdrop").classList.remove("open");render()}
$("menuBtn").onclick=openMenu; $("closeMenu").onclick=closeMenu;
$("plist").addEventListener("input",e=>{const i=e.target.dataset.i;if(i!==undefined){S.players[i]=e.target.value.trim()||("Spiller "+(+i+1));save()}});
$("plist").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]"); if(!d||S.players.length<=2)return; const i=+d.dataset.del;
  if(!confirm("Fjerne "+S.players[i]+" og poengene hans/hennes?"))return;
  S.players.splice(i,1); S.rounds.forEach(r=>r.splice(i,1)); save(); renderPlayers();
});
$("addPlayer").onclick=()=>{ if(S.players.length>=6)return; S.players.push("Spiller "+(S.players.length+1)); S.rounds.forEach(r=>r.push(null)); save(); renderPlayers(); };
$("delRound").onclick=()=>{ if(S.rounds.length<=1)return; const last=S.rounds[S.rounds.length-1];
  if(last.some(v=>v!==null)&&!confirm("Siste runde har poeng. Slette den?"))return;
  S.rounds.pop(); save(); renderPlayers(); };
$("newGame").onclick=()=>{ if(!confirm("Starte nytt spill? Navnene beholdes, poengene nullstilles."))return;
  S.rounds=[S.players.map(()=>null)]; save(); closeMenu(); };

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
