<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikke book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hvem som ikke skal bookes når, for Ventilasjonsspesialisten.">
<meta name="theme-color" content="#F4F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ikke book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#121518; --muted:#5F6970; --faint:#A2AAB0;
  --line:rgba(18,21,24,.09); --shadow:rgba(18,21,24,.07); --press:#ECEFF1;
  --cell:#F1F3F4; --ring:#FBEFEC; --busy-soft2:rgba(176,58,39,.14);
  --accent:#0E6E83; --accent-ink:#FFFFFF; --accent-soft:rgba(14,110,131,.12);
  --busy:#B03A27; --busy-soft:rgba(176,58,39,.08); --free:#2F8A57;
  --font:"Geist",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --toast:rgba(28,32,35,.94); --toast-ink:#F4F7F8; --pill-mix:16%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1012; --surface:#171B1E; --ink:#EEF2F4; --muted:#9AA4AA; --faint:#5F686E;
  --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.4); --press:#20262A;
  --cell:#20262A; --ring:#2A2220; --busy-soft2:rgba(238,122,100,.22);
  --accent:#3BA7C0; --accent-ink:#06191E; --accent-soft:rgba(59,167,192,.16);
  --busy:#EE7A64; --busy-soft:rgba(238,122,100,.14); --free:#5CC487;
  --toast:rgba(44,50,54,.95); --toast-ink:#EEF2F4; --pill-mix:30%;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1012; --surface:#171B1E; --ink:#EEF2F4; --muted:#9AA4AA; --faint:#5F686E;
  --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.4); --press:#20262A;
  --cell:#20262A; --ring:#2A2220; --busy-soft2:rgba(238,122,100,.22);
  --accent:#3BA7C0; --accent-ink:#06191E; --accent-soft:rgba(59,167,192,.16);
  --busy:#EE7A64; --busy-soft:rgba(238,122,100,.14); --free:#5CC487;
  --toast:rgba(44,50,54,.95); --toast-ink:#EEF2F4; --pill-mix:30%;
  color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding:calc(env(safe-area-inset-top,0px) + 44px) calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 20px)}
.card{background:var(--surface);border-radius:20px;box-shadow:0 0 0 .5px var(--line),0 1px 2px var(--shadow)}
h1{margin:0 4px;font-size:40px;line-height:1;font-weight:600;letter-spacing:-.045em}
h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.02em}

/* Kalender (design B) */
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.month{padding:12px 10px 10px;display:flex;flex-direction:column;gap:4px}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px}
.mhead h2{text-transform:capitalize}
.mhead span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.row7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{text-align:center;font-size:11px;font-weight:500;color:var(--muted)}
.d{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;transition:background-color 140ms ease,box-shadow 140ms ease}
.d .n{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;line-height:20px}
.d.out{visibility:hidden}
.d.we .n,.d.past .n{color:var(--faint)}
.d.busy{background:var(--busy-soft)}
.d.busy2{background:var(--busy-soft2)}
.d.busy .n,.d.busy2 .n{color:var(--ink)}
.d.past.busy,.d.past.busy2{opacity:.5}
.d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.d.today .n{font-weight:600;color:var(--ink)}
.d.sel{box-shadow:inset 0 0 0 1.5px var(--accent)}
.d.today.sel{box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 3px var(--accent)}
.d:disabled{cursor:default}
@media (hover:hover) and (pointer:fine){ .d:not(:disabled):not(.busy):not(.busy2):hover{background:var(--cell)} }
.d:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ini{display:flex}
.ini span{width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 1.5px var(--ring)}
.ini span + span{margin-left:-5px}

/* Nederst: liste + skjema */
.lower{display:flex;flex-direction:column;gap:20px}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}
.count{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;overflow:hidden}
.item{position:relative;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;transition:background-color 140ms ease}
.item + .item::before{content:"";position:absolute;top:0;left:34px;right:0;height:1px;background:var(--line);transform:scaleY(.5);transform-origin:top}
@media (hover:hover) and (pointer:fine){.item:hover{background:var(--cell)}}
.item .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.item .who{flex:none;font-weight:600;font-size:15px}
.item .note{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .when{flex:none;font-size:14px;font-variant-numeric:tabular-nums;text-align:right}
.item .now{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#fff;background:var(--busy);padding:2px 6px;border-radius:5px;margin-right:8px;vertical-align:1px}
.item.past{opacity:.55}
.item.enter{animation:enter 320ms var(--ease) both}
.item.enter::after{content:"";position:absolute;inset:0;background:var(--accent-soft);pointer-events:none;animation:glow 1400ms ease-out 200ms both}
@keyframes enter{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes glow{from{opacity:1}to{opacity:0}}
.item.leaving{overflow:hidden;transition:height 220ms var(--ease),opacity 160ms ease,padding 220ms var(--ease);opacity:0;padding-top:0;padding-bottom:0}
.del{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--faint);transition:background-color 140ms ease,color 140ms ease,transform 120ms var(--ease)}
.del svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.del:active{transform:scale(.9);background:var(--press);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.del:hover{background:var(--press);color:var(--ink)}}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.more{align-self:center;font-size:14px;font-weight:500;color:var(--accent);padding:8px 12px;border-radius:10px;transition:opacity 120ms ease}
.more:active{opacity:.55}

.form{display:flex;flex-direction:column;gap:16px;padding:16px;transition:box-shadow 300ms ease}
.form.flash{box-shadow:0 0 0 2px var(--accent),0 1px 2px var(--shadow)}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:13px;font-weight:500;color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;border-radius:999px;background:var(--press);font-size:14px;font-weight:500;transition:background-color 140ms ease,box-shadow 140ms ease,transform 120ms var(--ease)}
.chip .av{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:var(--c)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type="date"],input[type="text"]{width:100%;min-width:0;padding:10px 12px;border-radius:11px;border:0;background:var(--press);font-size:15px;outline:none;-webkit-appearance:none;appearance:none;min-height:42px}
input:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;
  transition:transform 120ms var(--ease),opacity 140ms ease,background-color 200ms ease,color 200ms ease}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.4;cursor:default;transform:none}
.primary.done,.primary.done:disabled{opacity:1;background:var(--free);color:#fff}
.primary svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.formmsg{margin:-6px 2px 0;font-size:13px;color:var(--muted);min-height:1em}
.formmsg.err{color:var(--busy)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:20;width:calc(100% - 32px);max-width:420px;
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--toast);color:var(--toast-ink);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 12px 32px -8px rgba(0,0,0,.35);
  transform:translate(-50%,calc(100% + 28px));opacity:0;visibility:hidden;
  transition:transform 240ms var(--ease-drawer),opacity 200ms ease,visibility 0s linear 240ms}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform 420ms var(--ease-drawer),opacity 200ms ease,visibility 0s}
.toast span{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;font-weight:600;font-size:14px;color:var(--toast-ink);padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);transition:transform 120ms var(--ease)}
.toast button:active{transform:scale(.95)}

.banner{display:none;padding:12px 14px;border-radius:14px;background:var(--busy-soft);font-size:14px}
.banner.show{display:block}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-size:12px;padding:0 4px}
.foot a{color:inherit;text-decoration:none}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--free)}
.sync.off i{background:var(--busy)}

/* Telefon: månedene under hverandre */
@media (max-width: 720px){
  .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 44px);padding-left:calc(env(safe-area-inset-left,0px) + 16px);padding-right:calc(env(safe-area-inset-right,0px) + 16px)}
  .months{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:120ms!important}
  .item.enter{animation:fade 200ms ease both}
  @keyframes fade{from{opacity:0}}
  .toast,.toast.show{transform:translate(-50%,0)}
  .chip:active,.primary:active,.del:active,.toast button:active,.iconbtn:active,.txtbtn:active{transform:none}
}
@media (prefers-reduced-transparency: reduce){ .toast{background:#1C2023;-webkit-backdrop-filter:none;backdrop-filter:none} }
</style>
</head>
<body>
<main class="wrap">
  <h1>Ikke book</h1>

  <div class="banner" id="banner"></div>

  <section class="months" id="months" aria-label="Kalender"></section>

  <div class="lower">
    <section class="section" aria-labelledby="h-list">
      <div class="head"><h2 id="h-list" style="font-size:14px">Alle kommende</h2><span class="count" id="count"></span></div>
      <ul class="list card" id="list"></ul>
      <button class="more" id="past" type="button">Vis tidligere</button>
    </section>

    <section class="section" aria-labelledby="h-add">
      <div class="head"><h2 id="h-add" style="font-size:14px">Legg inn</h2></div>
      <form class="card form" id="form" autocomplete="off">
        <div class="field">
          <span>Hvem (velg en eller flere)</span>
          <div class="people" id="pick"></div>
        </div>
        <div class="field">
          <span>Fra og til (med)</span>
          <div class="row2">
            <input type="date" id="fra" required aria-label="Fra dato">
            <input type="date" id="til" required aria-label="Til og med dato">
          </div>
        </div>
        <div class="field">
          <span>Notat (valgfritt)</span>
          <input type="text" id="notat" maxlength="140" placeholder="F.eks. ferie, bare formiddag, syk">
        </div>
        <button class="primary" id="save" type="submit" disabled>Lagre</button>
        <p class="formmsg" id="formmsg" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <footer class="foot">
    <span class="sync" id="sync"><i></i><span id="syncTxt">Kobler til …</span></span>
    <a href="/">raggan.no</a>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button type="button" id="undo">Angre</button></div>

<script>
(() => {
  const URL_ = "https://qcxxtvzarpxstlmyguqi.supabase.co/rest/v1/venti_blokker";
  const KEY = "sb_publishable_5m5Hsz9YfHSPK1MZhsXiHA_GjlwYQrW";
  const H = { apikey: KEY, "Content-Type": "application/json" };

  const PEOPLE = ["Espen","Cameron","Tony","Ramzan","Kevin","Andreas","Veselin","Kip"];
  const COLORS = ["#2F6FDE","#D9822B","#7B4FD6","#1F9D8A","#D2486E","#5B7A1F","#B5562E","#3D86A8"];
  const color = p => COLORS[PEOPLE.indexOf(p)] || "#888";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const today = () => iso(new Date());

  const fmtWd = new Intl.DateTimeFormat("nb-NO", { weekday: "short" });
  const fmtMonth = new Intl.DateTimeFormat("nb-NO", { month: "long" });
  const fmtFull = new Intl.DateTimeFormat("nb-NO", { weekday: "long", day: "numeric", month: "long" });
  const MONTHS = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
  const wd = d => fmtWd.format(d).replace(".", "");

  function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }
  function fmtRange(a, b) {
    const A = parse(a), B = parse(b), yNow = new Date().getFullYear();
    const yr = d => d.getFullYear() !== yNow ? " " + d.getFullYear() : "";
    if (a === b) return `${wd(A)} ${A.getDate()}. ${MONTHS[A.getMonth()]}${yr(A)}`;
    if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear())
      return `${A.getDate()}.–${B.getDate()}. ${MONTHS[A.getMonth()]}${yr(A)}`;
    return `${A.getDate()}. ${MONTHS[A.getMonth()]}${A.getFullYear()!==B.getFullYear()?yr(A):""} – ${B.getDate()}. ${MONTHS[B.getMonth()]}${yr(B)}`;
  }
  const avatar = p => `<span class="av" style="--c:${color(p)}" aria-hidden="true">${esc(p[0])}</span>`;

  // ---------- state ----------
  let rows = [];
  let showPast = false;
  let lastJson = "";
  let firstPaint = true;
  let touched = false;   // marker valgt periode i kalenderen først når noen har valgt dato
  const seen = new Set();
  const picked = new Set();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");

  // ---------- API ----------
  async function api(path = "", opts = {}) {
    const r = await fetch(URL_ + path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
    if (!r.ok) {
      let body = {}; try { body = await r.json(); } catch {}
      const e = new Error(body.message || r.statusText); e.code = body.code; e.status = r.status; throw e;
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
  function setSync(ok, txt) { $("sync").classList.toggle("off", !ok); $("syncTxt").textContent = txt; }
  function banner(msg) { const b = $("banner"); b.innerHTML = msg || ""; b.classList.toggle("show", !!msg); }
  const stamp = () => "Oppdatert " + new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" });

  async function load() {
    try {
      const data = await api("?select=*&order=fra.asc,person.asc");
      banner(""); setSync(true, stamp());
      const json = JSON.stringify(data);
      if (json === lastJson) return;
      lastJson = json; rows = data;
    } catch (e) {
      if (e.code === "PGRST205" || e.code === "42P01" || e.status === 404)
        banner("<b>Databasen er ikke satt opp ennå.</b> Kjør SQL-en i Supabase, så virker siden.");
      else banner("Fikk ikke kontakt med databasen. Sjekk nettet og prøv igjen.");
      setSync(false, "Frakoblet");
    }
    render();
  }

  // ---------- kalender ----------
  function entriesOn(s) {
    return rows.filter(r => r.fra <= s && r.til >= s).sort((a, b) => PEOPLE.indexOf(a.person) - PEOPLE.indexOf(b.person));
  }
  function renderMonth(year, month) {
    const first = new Date(year, month, 1), last = new Date(year, month + 1, 0);
    const t = today(), selA = $("fra").value, selB = $("til").value;
    const start = addDays(first, -((first.getDay() + 6) % 7));
    const name = fmtMonth.format(first);
    const wk1 = isoWeek(first), wk2 = isoWeek(last);
    let html = `<div class="card month"><div class="mhead"><h2>${esc(name)}${first.getFullYear() !== new Date().getFullYear() ? " " + first.getFullYear() : ""}</h2><span>UKE ${wk1}–${wk2}</span></div>
      <div class="row7">${["M","T","O","T","F","L","S"].map(x => `<span class="wd">${x}</span>`).join("")}</div>`;
    for (let w = start; w <= last; w = addDays(w, 7)) {
      html += `<div class="row7">`;
      for (let i = 0; i < 7; i++) {
        const day = addDays(w, i), s = iso(day);
        if (day.getMonth() !== month) { html += `<span class="d out" aria-hidden="true"></span>`; continue; }
        const es = entriesOn(s), past = s < t;
        const cls = ["d", i >= 5 ? "we" : "", es.length === 1 ? "busy" : es.length > 1 ? "busy2" : "", s === t ? "today" : "", past ? "past" : "",
          (touched && !past && selA && selB && s >= selA && s <= selB) ? "sel" : ""].filter(Boolean).join(" ");
        const tip = es.map(e => e.person + (e.notat ? ": " + e.notat : "")).join("\n");
        const label = `${fmtFull.format(day)}${es.length ? ". Ikke book: " + es.map(e => e.person).join(", ") : ""}`;
        html += `<button type="button" class="${cls}" data-d="${s}"${past ? " disabled" : ""} aria-label="${esc(label)}"${tip ? ` title="${esc(tip)}"` : ""}><span class="n">${day.getDate()}</span>${
          es.length ? `<span class="ini">${es.slice(0, 3).map(e => `<span style="--c:${color(e.person)}">${esc(e.person[0])}</span>`).join("")}</span>` : ""}</button>`;
      }
      html += `</div>`;
    }
    return html + `</div>`;
  }
  function renderCalendar() {
    const now = new Date();
    const a = new Date(now.getFullYear(), now.getMonth(), 1), b = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    $("months").innerHTML = renderMonth(a.getFullYear(), a.getMonth()) + renderMonth(b.getFullYear(), b.getMonth());
  }

  // ---------- liste ----------
  function renderList() {
    const t = today();
    const list = rows
      .filter(r => showPast ? r.til < t : r.til >= t)
      .sort((a, b) => showPast ? b.fra.localeCompare(a.fra) : (a.fra.localeCompare(b.fra) || PEOPLE.indexOf(a.person) - PEOPLE.indexOf(b.person)));
    $("h-list").textContent = showPast ? "Tidligere" : "Alle kommende";
    $("count").textContent = list.length ? list.length + " stk" : "";
    $("past").textContent = showPast ? "Vis kommende" : "Vis tidligere";
    if (!list.length) {
      $("list").innerHTML = `<li class="empty">${showPast ? "Ingenting tidligere." : "Ingen blokkeringer. Alle kan bookes."}</li>`;
      return;
    }
    $("list").innerHTML = list.map(r => {
      const now = r.fra <= t && r.til >= t;
      const isNew = !firstPaint && !seen.has(r.id);
      return `<li class="item${r.til < t ? " past" : ""}${isNew ? " enter" : ""}" data-id="${esc(r.id)}" style="--c:${color(r.person)}">
        <span class="dot" aria-hidden="true"></span><span class="who">${esc(r.person)}</span>
        <span class="note">${r.notat ? esc(r.notat) : ""}</span>
        <span class="when">${esc(fmtRange(r.fra, r.til))}</span>
        <button type="button" class="del" data-id="${esc(r.id)}" aria-label="Slett ${esc(r.person)} ${esc(fmtRange(r.fra, r.til))}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>`;
    }).join("");
  }
  function render() {
    renderCalendar(); renderList();
    rows.forEach(r => seen.add(r.id));
    if (lastJson) firstPaint = false;
  }

  // ---------- skjema ----------
  function validate() {
    const f = $("fra").value, t = $("til").value;
    $("save").disabled = !(picked.size > 0 && f && t && t >= f);
    const bad = f && t && t < f;
    $("formmsg").classList.toggle("err", !!bad);
    $("formmsg").textContent = bad ? "Til-datoen er før fra-datoen." : "";
  }
  function renderPick() {
    $("pick").innerHTML = PEOPLE.map(p =>
      `<button type="button" class="chip" data-p="${p}" aria-pressed="${picked.has(p)}" style="--c:${color(p)}">${avatar(p)}${esc(p)}</button>`).join("");
  }
  $("pick").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const p = b.dataset.p; picked.has(p) ? picked.delete(p) : picked.add(p);
    b.setAttribute("aria-pressed", picked.has(p)); validate();
  });
  $("fra").addEventListener("change", () => {
    if (!$("til").value || $("til").value < $("fra").value) $("til").value = $("fra").value;
    touched = true; validate(); renderCalendar();
  });
  $("til").addEventListener("change", () => { touched = true; validate(); renderCalendar(); });

  // Klikk på en dag = fyll inn datoen. Shift+klikk = utvid perioden.
  let flashTimer;
  $("months").addEventListener("click", e => {
    const b = e.target.closest(".d[data-d]"); if (!b || b.disabled) return;
    const s = b.dataset.d, f = $("fra").value;
    if (e.shiftKey && f) {
      if (s >= f) $("til").value = s; else { $("til").value = $("til").value > f ? $("til").value : f; $("fra").value = s; }
    } else { $("fra").value = s; $("til").value = s; }
    touched = true; validate(); renderCalendar();
    const form = $("form");
    const r = form.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) form.scrollIntoView({ block: "nearest", behavior: reduced.matches ? "auto" : "smooth" });
    form.classList.add("flash"); clearTimeout(flashTimer); flashTimer = setTimeout(() => form.classList.remove("flash"), 700);
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault(); if ($("save").disabled) return;
    const fra = $("fra").value, til = $("til").value, notat = $("notat").value.trim() || null;
    const payload = [...picked].map(person => ({ person, fra, til, notat }));
    $("save").disabled = true; $("save").textContent = "Lagrer …";
    try {
      await api("", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(payload) });
      picked.clear(); renderPick(); $("notat").value = "";
      showPast = false; touched = false;
      await load();
      const btn = $("save");
      btn.classList.add("done");
      btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Lagret';
      setTimeout(() => { btn.classList.remove("done"); btn.textContent = "Lagre"; validate(); }, 1400);
      return;
    } catch (err) {
      $("formmsg").classList.add("err");
      $("formmsg").textContent = "Klarte ikke å lagre. Prøv igjen.";
    }
    $("save").textContent = "Lagre"; validate();
  });

  // ---------- slett med angre ----------
  let undoRow = null, toastTimer;
  function toast(msg) {
    $("toastTxt").textContent = msg; $("toast").classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $("toast").classList.remove("show"); undoRow = null; }
  function collapse(li) {
    return new Promise(res => {
      if (reduced.matches) { li.style.opacity = 0; return setTimeout(res, 120); }
      li.style.height = li.offsetHeight + "px"; li.offsetHeight;
      li.classList.add("leaving"); li.style.height = "0px";
      setTimeout(res, 230);
    });
  }
  $("list").addEventListener("click", async e => {
    const b = e.target.closest(".del"); if (!b) return;
    const id = b.dataset.id, row = rows.find(r => r.id === id); if (!row) return;
    b.disabled = true;
    try { await api("?id=eq." + encodeURIComponent(id), { method: "DELETE" }); }
    catch { b.disabled = false; banner("Klarte ikke å slette. Prøv igjen."); return; }
    await collapse(b.closest(".item"));
    rows = rows.filter(r => r.id !== id); lastJson = ""; seen.delete(id);
    renderCalendar(); renderList();
    undoRow = { id: row.id, person: row.person, fra: row.fra, til: row.til, notat: row.notat };
    toast(`Slettet ${row.person}, ${fmtRange(row.fra, row.til)}`);
  });
  $("undo").addEventListener("click", async () => {
    if (!undoRow) return;
    const r = undoRow; hideToast();
    try { await api("", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify([r]) }); }
    catch { banner("Klarte ikke å angre. Legg den inn på nytt."); }
    load();
  });
  $("past").addEventListener("click", () => { showPast = !showPast; renderList(); });

  // ---------- start ----------
  const t0 = today(); $("fra").value = t0; $("til").value = t0;
  renderPick(); render(); validate(); load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
