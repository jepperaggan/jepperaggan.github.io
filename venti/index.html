<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikke book</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Hvem som ikke skal bookes når, for Ventilasjonsspesialisten.">
<meta name="theme-color" content="#F4F6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1012" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ikke book">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#121518; --muted:#667077; --faint:#A2AAB0;
  --line:rgba(18,21,24,.09); --shadow:rgba(18,21,24,.07); --press:#ECEFF1;
  --accent:#0E6E83; --accent-ink:#FFFFFF; --accent-soft:rgba(14,110,131,.10);
  --busy:#C2412D; --busy-soft:rgba(194,65,45,.10); --free:#2F8A57; --free-soft:rgba(47,138,87,.10);
  --font:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(0.23,1,0.32,1); --ease-drawer:cubic-bezier(0.32,0.72,0,1);
  --glass:rgba(244,246,247,.72); --toast:rgba(28,32,35,.94); --toast-ink:#F4F7F8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1012; --surface:#171B1E; --ink:#EEF2F4; --muted:#9AA4AA; --faint:#5F686E;
  --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.4); --press:#20262A;
  --accent:#3BA7C0; --accent-ink:#06191E; --accent-soft:rgba(59,167,192,.14);
  --busy:#EE7A64; --busy-soft:rgba(238,122,100,.14); --free:#5CC487; --free-soft:rgba(92,196,135,.13);
  --glass:rgba(13,16,18,.72); --toast:rgba(44,50,54,.95); --toast-ink:#EEF2F4;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1012; --surface:#171B1E; --ink:#EEF2F4; --muted:#9AA4AA; --faint:#5F686E;
  --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.4); --press:#20262A;
  --accent:#3BA7C0; --accent-ink:#06191E; --accent-soft:rgba(59,167,192,.14);
  --busy:#EE7A64; --busy-soft:rgba(238,122,100,.14); --free:#5CC487; --free-soft:rgba(92,196,135,.13);
  --glass:rgba(13,16,18,.72); --toast:rgba(44,50,54,.95); --toast-ink:#EEF2F4;
  color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:28px;
  padding:calc(env(safe-area-inset-top,0px) + 44px) calc(env(safe-area-inset-right,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 40px) calc(env(safe-area-inset-left,0px) + 16px)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
header{display:flex;flex-direction:column;gap:8px;padding:0 4px}
h1{margin:0 4px 4px;font-size:clamp(34px,10vw,42px);line-height:1;font-weight:600;letter-spacing:-.045em}
.lede{margin:0;color:var(--muted);font-size:16px;max-width:36ch}
h2{margin:0;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.card{background:var(--surface);border-radius:22px;box-shadow:0 0 0 .5px var(--line),0 1px 2px var(--shadow);padding:16px}
.section{display:flex;flex-direction:column;gap:10px}
.section > .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px}

.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:var(--c)}

/* Skjema */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field > span{font-size:13px;font-weight:500;color:var(--muted)}
.people{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--press);font-size:15px;font-weight:500;transition:background-color 140ms ease,box-shadow 140ms ease,transform 120ms var(--ease)}
.chip .av{width:24px;height:24px;font-size:11px}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type="date"],input[type="text"]{width:100%;min-width:0;padding:11px 12px;border-radius:12px;border:0;background:var(--press);font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:44px}
input:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:13px;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--press);color:var(--muted)}
.quick button:active{transform:scale(.96)}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;transition:transform 120ms var(--ease),opacity 140ms ease}
.primary:active{transform:scale(.98)}
.primary{transition:transform 120ms var(--ease),opacity 140ms ease,background-color 200ms ease,color 200ms ease}
.primary:disabled{opacity:.4;cursor:default;transform:none}
.primary.done,.primary.done:disabled{opacity:1;background:var(--free);color:#fff}
.primary svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.formmsg{margin:-6px 2px 0;font-size:13px;color:var(--muted);min-height:1em}
.formmsg.err{color:var(--busy)}

/* Liste */
.bar{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 1px 0 transparent;transition:box-shadow 200ms ease}
.bar.stuck{box-shadow:0 .5px 0 var(--line)}
.sentinel{height:1px;margin-bottom:-11px}
.tools{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 .5px var(--line);color:var(--muted);
  transition:background-color 160ms ease,color 160ms ease,transform 120ms var(--ease)}
.tools button:active{transform:scale(.96)}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:22px;box-shadow:0 0 0 .5px var(--line),0 1px 2px var(--shadow);overflow:hidden}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.item + .item::before{content:"";position:absolute;top:0;left:54px;right:0;height:1px;background:var(--line);transform:scaleY(.5);transform-origin:top}
.item .av{width:30px;height:30px;font-size:12px}
.item .body{flex:1;min-width:0}
.item .who{font-weight:600;font-size:16px;letter-spacing:-.015em}
.item .when{font-size:15px}
.item .note{display:block;font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.item .now{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--busy);vertical-align:2px}
.item.past{opacity:.55}
.item.enter{animation:enter 320ms var(--ease) both}
.item.enter::after{content:"";position:absolute;inset:0;background:var(--accent-soft);pointer-events:none;animation:glow 1400ms ease-out 200ms both}
@keyframes enter{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes glow{from{opacity:1}to{opacity:0}}
.item.leaving{overflow:hidden;transition:height 220ms var(--ease),opacity 160ms ease,padding 220ms var(--ease);opacity:0;padding-top:0;padding-bottom:0}
.del{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--faint);transition:background-color 140ms ease,color 140ms ease,transform 120ms var(--ease)}
.del:active{transform:scale(.9);background:var(--press);color:var(--ink)}
.del svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
@media (hover:hover) and (pointer:fine){.del:hover{background:var(--press);color:var(--ink)}}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px}
.more{align-self:center;font-size:14px;font-weight:500;color:var(--accent);padding:8px 12px;border-radius:10px;transition:opacity 120ms ease}
.more:active{opacity:.55}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;width:calc(100% - 32px);max-width:528px;
  display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--toast);color:var(--toast-ink);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 12px 32px -8px rgba(0,0,0,.35);
  transform:translate(-50%,calc(100% + 24px));opacity:0;visibility:hidden;
  transition:transform 240ms var(--ease-drawer),opacity 200ms ease,visibility 0s linear 240ms}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform 420ms var(--ease-drawer),opacity 200ms ease,visibility 0s}
.toast span{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;font-weight:600;font-size:15px;color:var(--toast-ink);padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);transition:transform 120ms var(--ease)}
.toast button:active{transform:scale(.95)}
.banner{display:none;padding:12px 14px;border-radius:14px;background:var(--busy-soft);color:var(--ink);font-size:14px}
.banner.show{display:block}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-size:12px;padding:0 4px}
.foot a{color:inherit;text-decoration:none}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--free)}
.sync.off i{background:var(--busy)}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:120ms!important}
  .item.enter{animation:fade 200ms ease both}
  @keyframes fade{from{opacity:0}}
  .toast,.toast.show{transform:translate(-50%,0)}
  .chip:active,.primary:active,.tools button:active,.del:active,.toast button:active,.quick button:active{transform:none}
}
@media (prefers-reduced-transparency: reduce){
  .bar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .toast{background:#1C2023;-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="banner" id="banner"></div>

  <section class="section" aria-labelledby="h-list">
    <h1 id="h-list">Ikke book</h1>
    <div class="sentinel" id="sentinel" aria-hidden="true"></div>
    <div class="bar" id="bar"><div class="tools" id="filter" role="group" aria-label="Filtrer på person"></div></div>
    <ul class="list" id="list"></ul>
    <button class="more" id="past" type="button">Vis tidligere</button>
  </section>

  <section class="section" aria-labelledby="h-add">
    <div class="head"><h2 id="h-add">Legg inn</h2></div>
    <form class="card form" id="form" autocomplete="off">
      <div class="field">
        <span>Hvem (velg en eller flere)</span>
        <div class="people" id="pick"></div>
      </div>
      <div class="field">
        <span>Når</span>
        <div class="row2">
          <input type="date" id="fra" required aria-label="Fra dato">
          <input type="date" id="til" required aria-label="Til og med dato">
        </div>
        <div class="quick" id="quick">
          <button type="button" data-q="0">I dag</button>
          <button type="button" data-q="1">I morgen</button>
          <button type="button" data-q="w">Resten av uka</button>
          <button type="button" data-q="nw">Neste uke</button>
        </div>
      </div>
      <div class="field">
        <span>Notat (valgfritt)</span>
        <input type="text" id="notat" maxlength="140" placeholder="F.eks. ferie, bare formiddag, syk">
      </div>
      <button class="primary" id="save" type="submit" disabled>Lagre</button>
      <p class="formmsg" id="formmsg" aria-live="polite"></p>
    </form>
  </section>

  <footer class="foot">
    <span class="sync" id="sync"><i></i><span id="syncTxt">Kobler til …</span></span>
    <a href="/">raggan.no</a>
  </footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button type="button" id="undo">Angre</button></div>

<script>
(() => {
  const URL_ = "https://qcxxtvzarpxstlmyguqi.supabase.co/rest/v1/venti_blokker";
  const KEY = "sb_publishable_5m5Hsz9YfHSPK1MZhsXiHA_GjlwYQrW";
  const H = { apikey: KEY, "Content-Type": "application/json" };

  const PEOPLE = ["Espen","Cameron","Tony","Ramzan","Kevin","Andreas","Veselin","Kip"];
  const COLORS = ["#2F6FDE","#D9822B","#7B4FD6","#1F9D8A","#D2486E","#5B7A1F","#B5562E","#3D86A8"];
  const color = p => COLORS[PEOPLE.indexOf(p)] || "#888";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const today = () => iso(new Date());

  const fmtWd = new Intl.DateTimeFormat("nb-NO", { weekday: "short" });
  const MONTHS = ["jan","feb","mar","apr","mai","jun","jul","aug","sep","okt","nov","des"];
  const wd = d => fmtWd.format(d).replace(".", "");
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  function fmtRange(a, b) {
    const A = parse(a), B = parse(b), yNow = new Date().getFullYear();
    const yr = d => d.getFullYear() !== yNow ? " " + d.getFullYear() : "";
    if (a === b) return `${wd(A)} ${A.getDate()}. ${MONTHS[A.getMonth()]}${yr(A)}`;
    if (A.getMonth() === B.getMonth() && A.getFullYear() === B.getFullYear())
      return `${A.getDate()}.–${B.getDate()}. ${MONTHS[A.getMonth()]}${yr(A)}`;
    return `${A.getDate()}. ${MONTHS[A.getMonth()]}${A.getFullYear()!==B.getFullYear()?yr(A):""} – ${B.getDate()}. ${MONTHS[B.getMonth()]}${yr(B)}`;
  }
  const avatar = p => `<span class="av" style="--c:${color(p)}" aria-hidden="true">${esc(p[0])}</span>`;

  // ---------- state ----------
  let rows = [];
  let filter = "Alle";
  let showPast = false;
  let lastJson = "";
  const seen = new Set();   // ids vist før, så bare nye rader animeres inn
  let firstPaint = true;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  const picked = new Set();

  // ---------- API ----------
  async function api(path = "", opts = {}) {
    const r = await fetch(URL_ + path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
    if (!r.ok) {
      let body = {}; try { body = await r.json(); } catch {}
      const e = new Error(body.message || r.statusText); e.code = body.code; e.status = r.status; throw e;
    }
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
  function setSync(ok, txt) { $("sync").classList.toggle("off", !ok); $("syncTxt").textContent = txt; }
  function banner(msg) { const b = $("banner"); b.innerHTML = msg || ""; b.classList.toggle("show", !!msg); }

  async function load() {
    try {
      const data = await api("?select=*&order=fra.asc,person.asc");
      const json = JSON.stringify(data);
      if (json === lastJson) { banner(""); setSync(true, "Oppdatert " + new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" })); return; }
      lastJson = json; rows = data;
      banner("");
      setSync(true, "Oppdatert " + new Date().toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) {
      if (e.code === "PGRST205" || e.code === "42P01" || e.status === 404)
        banner("<b>Databasen er ikke satt opp ennå.</b> Kjør SQL-en i Supabase, så virker siden.");
      else banner("Fikk ikke kontakt med databasen. Sjekk nettet og prøv igjen.");
      setSync(false, "Frakoblet");
    }
    render();
  }

  // ---------- render ----------
  function renderPick() {
    $("pick").innerHTML = PEOPLE.map(p =>
      `<button type="button" class="chip" data-p="${p}" aria-pressed="${picked.has(p)}">${avatar(p)}${esc(p)}</button>`).join("");
  }
  function renderFilter() {
    $("filter").innerHTML = ["Alle", ...PEOPLE].map(p =>
      `<button type="button" data-f="${p}" aria-pressed="${p===filter}">${esc(p)}</button>`).join("");
  }
  function renderList() {
    const t = today();
    const list = rows
      .filter(r => filter === "Alle" || r.person === filter)
      .filter(r => showPast ? r.til < t : r.til >= t)
      .sort((a, b) => showPast ? (b.fra.localeCompare(a.fra)) : (a.fra.localeCompare(b.fra) || a.person.localeCompare(b.person)));
    $("past").textContent = showPast ? "Vis kommende" : "Vis tidligere";
    if (!list.length) {
      $("list").innerHTML = `<li class="empty">${showPast ? "Ingenting tidligere." : (filter==="Alle" ? "Ingen blokkeringer. Alle kan bookes." : esc(filter) + " kan bookes alle dager.")}</li>`;
      return;
    }
    $("list").innerHTML = list.map(r => {
      const now = r.fra <= t && r.til >= t;
      const isNew = !firstPaint && !seen.has(r.id);
      return `<li class="item${r.til < t ? " past" : ""}${isNew ? " enter" : ""}" data-id="${esc(r.id)}">${avatar(r.person)}
        <div class="body"><span class="who">${esc(r.person)}</span>${now ? '<span class="now">nå</span>' : ""}
          <div class="when">${esc(fmtRange(r.fra, r.til))}</div>${r.notat ? `<span class="note">${esc(r.notat)}</span>` : ""}</div>
        <button type="button" class="del" data-id="${esc(r.id)}" aria-label="Slett ${esc(r.person)} ${esc(fmtRange(r.fra, r.til))}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></li>`;
    }).join("");
  }
  function render() {
    renderList();
    rows.forEach(r => seen.add(r.id));
    if (rows.length || lastJson) firstPaint = false;
  }

  // ---------- form ----------
  function setRange(a, b) { $("fra").value = iso(a); $("til").value = iso(b); validate(); }
  function validate() {
    const f = $("fra").value, t = $("til").value;
    const ok = picked.size > 0 && f && t && t >= f;
    $("save").disabled = !ok;
    $("formmsg").classList.remove("err");
    $("formmsg").textContent = f && t && t < f ? "Til-datoen er før fra-datoen." : "";
    if (f && t && t < f) $("formmsg").classList.add("err");
  }

  $("pick").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const p = b.dataset.p; picked.has(p) ? picked.delete(p) : picked.add(p);
    b.setAttribute("aria-pressed", picked.has(p)); validate();
  });
  $("fra").addEventListener("change", () => {
    if (!$("til").value || $("til").value < $("fra").value) $("til").value = $("fra").value;
    validate();
  });
  $("til").addEventListener("change", validate);
  $("quick").addEventListener("click", e => {
    const q = e.target.closest("button")?.dataset.q; if (q == null) return;
    const t = parse(today()), dow = (t.getDay() + 6) % 7; // man=0
    if (q === "0") setRange(t, t);
    else if (q === "1") setRange(addDays(t,1), addDays(t,1));
    else if (q === "w") setRange(t, addDays(t, Math.max(0, 4 - dow)));
    else if (q === "nw") { const m = addDays(t, 7 - dow); setRange(m, addDays(m, 4)); }
  });

  $("form").addEventListener("submit", async e => {
    e.preventDefault(); if ($("save").disabled) return;
    const fra = $("fra").value, til = $("til").value, notat = $("notat").value.trim() || null;
    const payload = [...picked].map(person => ({ person, fra, til, notat }));
    $("save").disabled = true; $("save").textContent = "Lagrer …";
    try {
      await api("", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify(payload) });
      picked.clear(); renderPick(); $("notat").value = "";
      if (!showPast) { if (filter !== "Alle" && !payload.some(x => x.person === filter)) { filter = "Alle"; renderFilter(); } }
      await load();
      const fresh = $("list").querySelector(".item.enter");
      if (fresh) fresh.scrollIntoView({ block: "nearest", behavior: reduced.matches ? "auto" : "smooth" });
      const btn = $("save");
      btn.classList.add("done");
      btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Lagret';
      setTimeout(() => { btn.classList.remove("done"); btn.textContent = "Lagre"; btn.disabled = picked.size === 0; }, 1400);
      return;
    } catch (err) {
      $("formmsg").classList.add("err");
      $("formmsg").textContent = "Klarte ikke å lagre. Prøv igjen.";
    }
    $("save").textContent = "Lagre"; $("save").disabled = picked.size === 0;
  });

  // ---------- list actions ----------
  // Slett med en gang, med «Angre» i en toast (tilgivelse i stedet for bekreftelsesdialog)
  let undoRow = null, toastTimer;
  function toast(msg) {
    $("toastTxt").textContent = msg; $("toast").classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $("toast").classList.remove("show"); undoRow = null; }

  function collapse(li) {
    return new Promise(res => {
      if (reduced.matches) { li.style.opacity = 0; return setTimeout(res, 120); }
      li.style.height = li.offsetHeight + "px"; li.offsetHeight;
      li.classList.add("leaving"); li.style.height = "0px";
      setTimeout(res, 230);
    });
  }

  $("list").addEventListener("click", async e => {
    const b = e.target.closest(".del"); if (!b) return;
    const id = b.dataset.id, row = rows.find(r => r.id === id); if (!row) return;
    const li = b.closest(".item");
    b.disabled = true;
    try {
      await api("?id=eq." + encodeURIComponent(id), { method: "DELETE" });
    } catch { b.disabled = false; banner("Klarte ikke å slette. Prøv igjen."); return; }
    await collapse(li);
    rows = rows.filter(r => r.id !== id); lastJson = ""; renderList();
    undoRow = { id: row.id, person: row.person, fra: row.fra, til: row.til, notat: row.notat };
    seen.delete(row.id);
    toast(`Slettet ${row.person}, ${fmtRange(row.fra, row.til)}`);
  });
  $("undo").addEventListener("click", async () => {
    if (!undoRow) return;
    const r = undoRow; hideToast();
    try { await api("", { method: "POST", headers: { Prefer: "return=minimal" }, body: JSON.stringify([r]) }); }
    catch { banner("Klarte ikke å angre. Legg den inn på nytt."); }
    load();
  });
  $("filter").addEventListener("click", e => {
    const f = e.target.closest("button")?.dataset.f; if (!f) return;
    filter = f; renderFilter(); renderList();
  });
  $("past").addEventListener("click", () => { showPast = !showPast; renderList(); });

  // ---------- sticky bar: skillelinje bare når innhold glir under ----------
  new IntersectionObserver(([en]) => $("bar").classList.toggle("stuck", !en.isIntersecting)).observe($("sentinel"));

  // ---------- init ----------
  const t0 = parse(today()); setRange(t0, t0); $("save").disabled = true;
  renderPick(); renderFilter(); render(); load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
